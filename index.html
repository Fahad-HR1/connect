<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#000103; --ink:#eef4ff; --muted:#93a3bd; --cyan:#7fd3f5;
    --line:rgba(132,169,255,.22); --fill:rgba(132,169,255,.07);
  }
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100dvh; background:var(--bg); color:var(--ink);
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased; position:relative; overflow-x:hidden;
    display:flex; flex-direction:column; align-items:center;
    padding:max(52px,env(safe-area-inset-top)) 24px max(30px,env(safe-area-inset-bottom));
  }

  /* diagonal light streaks — same language as the printed card */
  .st{position:fixed;pointer-events:none;z-index:0}
  .s1{top:-14vh;left:-24vw;width:60vw;height:70vh;transform:rotate(45deg);
      background:linear-gradient(180deg,rgba(1,62,106,0),rgba(3,70,140,.55),rgba(1,24,106,0))}
  .s2{top:-8vh;left:2vw;width:3px;height:58vh;transform:rotate(45deg);opacity:.5;
      background:linear-gradient(180deg,transparent,#43d1ff,transparent)}
  .s3{bottom:-20vh;right:-28vw;width:66vw;height:74vh;transform:rotate(45deg);
      background:linear-gradient(180deg,rgba(1,62,106,0),rgba(3,70,140,.5),rgba(1,24,106,0))}
  .s4{bottom:-12vh;right:5vw;width:3px;height:56vh;transform:rotate(45deg);opacity:.45;
      background:linear-gradient(180deg,transparent,#43d1ff,transparent)}

  .wrap{position:relative;z-index:2;width:100%;max-width:420px;
        display:flex;flex-direction:column;align-items:center;flex:1}

  .hr{font-weight:700;font-size:clamp(42px,13vw,54px);line-height:1;letter-spacing:.05em;
      background:linear-gradient(180deg,#f2fbff,#8fdcff 48%,#43d1ff);
      -webkit-background-clip:text;background-clip:text;color:transparent}
  .name{margin-top:24px;font-size:clamp(19px,5.6vw,23px);font-weight:500;
        letter-spacing:.16em;text-align:center}
  .name span{color:var(--cyan)}
  .role{margin-top:11px;font-size:clamp(9.5px,2.8vw,11px);letter-spacing:.24em;
        color:var(--muted);font-style:italic;text-align:center}
  .rule{width:112px;height:1px;margin-top:22px;
        background:linear-gradient(90deg,transparent,#43d1ff,transparent)}

  .btns{width:100%;margin-top:38px;display:flex;flex-direction:column;gap:12px}
  .b{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;
     padding:16px 19px;border-radius:14px;text-decoration:none;color:var(--ink);
     background:var(--fill);border:1px solid var(--line);
     transition:background .18s ease,border-color .18s ease,transform .12s ease}
  .b:active{transform:scale(.985)}
  @media(hover:hover){.b:hover{background:rgba(132,169,255,.13);border-color:rgba(132,169,255,.42)}}
  .b.primary{background:linear-gradient(100deg,rgba(67,209,255,.20),rgba(47,99,201,.16));
             border-color:rgba(67,209,255,.5)}
  @media(hover:hover){.b.primary:hover{background:linear-gradient(100deg,rgba(67,209,255,.30),rgba(47,99,201,.24))}}
  .b .ic{width:21px;height:21px;flex:none;stroke:var(--cyan);fill:none;stroke-width:1.7;
         stroke-linecap:round;stroke-linejoin:round}
  .b .t{flex:1;font-size:clamp(13.5px,3.9vw,14.5px);letter-spacing:.05em;font-weight:400}
  .b .ar{width:15px;height:15px;flex:none;stroke:#5f7ba8;fill:none;stroke-width:2;
         stroke-linecap:round;stroke-linejoin:round}

  .foot{width:100%;margin-top:auto;padding-top:34px;display:flex;gap:12px}
  .mini{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;
        min-height:50px;border-radius:14px;text-decoration:none;color:var(--ink);
        background:var(--fill);border:1px solid var(--line);
        transition:background .18s ease,border-color .18s ease}
  @media(hover:hover){.mini:hover{background:rgba(132,169,255,.13);border-color:rgba(132,169,255,.42)}}
  .mini svg{width:17px;height:17px;stroke:var(--cyan);fill:none;stroke-width:1.7;
            stroke-linecap:round;stroke-linejoin:round}
  .mini span{font-size:13.5px;letter-spacing:.06em}
</style>
</head>
<body>
  <div class="st s1"></div><div class="st s2"></div>
  <div class="st s3"></div><div class="st s4"></div>

  <main class="wrap">

    <div class="rule"></div>

    <nav class="btns">

        <svg class="ic" viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2M2.5 12h19"/></svg>
        <span class="t">View My Portfolio</span>
        <svg class="ar" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>

      <a class="b" href="cv.pdf" target="_blank" rel="noopener">

        <span class="t">Download My CV</span>
        <svg class="ar" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </a>

      <a class="b" href="https://linkedin.com/in/fahad-alamlki" target="_blank" rel="noopener">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 10v7M7 7v.01M11.5 17v-4a2.5 2.5 0 015 0v4"/></svg>
        <span class="t">Connect on LinkedIn</span>
        <svg class="ar" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </a>

      <a class="b" href="contact.vcf">
        <svg class="ic" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        <span class="t">Save My Contact</span>
        <svg class="ar" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </a>
    </nav>

    <div class="foot">
      <a class="mini" href="tel:+966565351223">
        <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.4 2.1L8.1 9.9a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.5c.9.4 1.8.6 2.8.7a2 2 0 011.7 2z"/></svg>
        <span>Call</span>
      </a>
      <a class="mini" href="mailto:aafahad171@gmail.com">
        <svg viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="M3 6l9 7 9-7"/></svg>
        <span>Email</span>
      </a>
    </div>
  </main>
</body>
</html>
