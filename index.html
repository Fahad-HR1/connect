<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;
            -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#000103; --ink:#eef4ff; --muted:#93a3bd; --cyan:#7fd3f5; --glow:#43d1ff;
    --line:rgba(132,169,255,.22);
  }
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100dvh; background:var(--bg); color:var(--ink);
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased; position:relative; overflow-x:hidden;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(58px + env(safe-area-inset-top,0px)) 24px calc(30px + env(safe-area-inset-bottom,0px));
    perspective:1100px;
  }

  /* GPU particle field + morphing HR mark */
  #gl{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;
      opacity:0;transition:opacity .9s ease .15s}
  #gl.on{opacity:1}

  .st{position:fixed;pointer-events:none;z-index:0}
  .s1{top:-14vh;left:-24vw;width:60vw;height:70vh;transform:rotate(45deg);
      background:linear-gradient(180deg,rgba(1,62,106,0),rgba(3,70,140,.45),rgba(1,24,106,0))}
  .s2{top:-8vh;left:2vw;width:3px;height:58vh;transform:rotate(45deg);opacity:.45;
      background:linear-gradient(180deg,transparent,var(--glow),transparent)}
  .s3{bottom:-20vh;right:-28vw;width:66vw;height:74vh;transform:rotate(45deg);
      background:linear-gradient(180deg,rgba(1,62,106,0),rgba(3,70,140,.4),rgba(1,24,106,0))}
  .s4{bottom:-12vh;right:5vw;width:3px;height:56vh;transform:rotate(45deg);opacity:.4;
      background:linear-gradient(180deg,transparent,var(--glow),transparent)}

  .wrap{position:relative;z-index:2;width:100%;max-width:420px;
        display:flex;flex-direction:column;align-items:center;flex:1;
        transform-style:preserve-3d}
  /* the camera pull-back : everything rushes back into place on load */
  .stage{width:100%;display:flex;flex-direction:column;align-items:center;flex:1;
         transform-style:preserve-3d;
         animation:pullback 10.4s cubic-bezier(.10,.55,.12,1) both}
  .stage.pre{animation:none;opacity:0}
  @keyframes pullback{
    0%  {opacity:0; filter:blur(30px); transform:scale(4.2)  translateY(110px) rotate(7deg)}
    80% {opacity:0}
    92% {opacity:1; filter:blur(5px)}
    100%{opacity:1; filter:blur(0);    transform:scale(1) translateY(0) rotate(0)}
  }
  /* impact beat when the letters lock in */
  .flash{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;mix-blend-mode:screen;
         background:radial-gradient(circle at 50% 15.5%,
                    rgba(200,240,255,.95) 0%, rgba(120,200,255,.55) 16%,
                    rgba(60,150,255,.18) 34%, rgba(0,0,0,0) 58%)}
  body.go .flash{animation:flash 1.0s ease-out 9.45s both}
  @keyframes flash{0%{opacity:0}14%{opacity:.85}100%{opacity:0}}
  .wave{position:fixed;left:50%;top:15.5%;z-index:3;pointer-events:none;
        width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
        border:2px solid rgba(127,211,245,.9);opacity:0}
  body.go .wave{animation:wave 1.6s cubic-bezier(.16,1,.3,1) 9.50s both}
  body.go .wave.b{animation-delay:9.68s;border-color:rgba(132,169,255,.6)}
  @keyframes wave{
    0%{opacity:.95; transform:scale(.2)}
    100%{opacity:0; transform:scale(34)}
  }

  .markbox{position:relative;transform-style:preserve-3d}
  .hr,.hrback{font-weight:700;font-size:clamp(54px,17vw,72px);line-height:1;
      letter-spacing:.04em;white-space:nowrap}
  .hr{position:relative;z-index:2;
      background:linear-gradient(180deg,#ffffff,#d6f2ff 28%,#7fd3f5 60%,#43d1ff);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      transform:translateZ(46px);animation:float 5.5s ease-in-out infinite}
  .hrback{position:absolute;left:0;top:0;z-index:1;color:#0f4a86;
      transform:translateZ(30px);animation:floatb 5.5s ease-in-out infinite;
      text-shadow:1px 1px 0 #14508f,2px 2px 0 #124883,3px 3px 0 #0f3f74,
                  4px 4px 0 #0d3765,5px 5px 0 #0b2f56,6px 6px 0 #092747,
                  7px 7px 0 #071f39,8px 10px 18px rgba(0,0,0,.9)}
  @keyframes float{0%,100%{transform:translateZ(46px) translateY(0)}50%{transform:translateZ(46px) translateY(-6px)}}
  @keyframes floatb{0%,100%{transform:translateZ(30px) translateY(0)}50%{transform:translateZ(30px) translateY(-6px)}}
  /* when WebGL takes over, the DOM mark only reserves space */
  body.gpu .hr,body.gpu .hrback{visibility:hidden}

  .halo{position:absolute;left:50%;top:50%;width:230px;height:230px;z-index:0;
        transform:translate(-50%,-50%) translateZ(-20px);pointer-events:none;

  .name{margin-top:26px;font-size:clamp(19px,5.6vw,23px);font-weight:500;

  .role{margin-top:11px;font-size:clamp(9.5px,2.8vw,11px);letter-spacing:.24em;
        color:var(--muted);font-style:italic;text-align:center;transform:translateZ(14px)}
  .rule{width:112px;height:1px;margin-top:22px;transform:translateZ(10px);
        background:linear-gradient(90deg,transparent,var(--glow),transparent)}

  .btns{width:100%;margin-top:auto;padding-top:34px;display:flex;flex-direction:column;gap:12px;
        transform-style:preserve-3d}
  .b{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;
     width:100%;min-height:56px;padding:16px 19px;border-radius:15px;
     text-decoration:none;color:var(--ink);
     background:linear-gradient(145deg,rgba(132,169,255,.10),rgba(132,169,255,.03));
     border:1px solid var(--line);
     -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
     box-shadow:0 10px 26px -14px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.07);
     transform:translateZ(var(--z,10px));
     transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
     animation:rise .6s cubic-bezier(.22,1,.36,1) backwards}
  .b:nth-child(1){--z:22px;animation-delay:.06s}
  .b:nth-child(2){--z:18px;animation-delay:.14s}
  .b:nth-child(3){--z:14px;animation-delay:.22s}
  .b:nth-child(4){--z:10px;animation-delay:.30s}
  @keyframes rise{from{opacity:0;transform:translateZ(0) translateY(22px) rotateX(-18deg)}}
  .b:active{transform:translateZ(var(--z,10px)) scale(.985)}
  @media(hover:hover){.b:hover{border-color:rgba(67,209,255,.5);
    box-shadow:0 16px 34px -16px rgba(0,0,0,.95),0 0 0 1px rgba(67,209,255,.12),
               inset 0 1px 0 rgba(255,255,255,.1)}}
  .b.primary{background:linear-gradient(145deg,rgba(67,209,255,.22),rgba(47,99,201,.12));
             border-color:rgba(67,209,255,.45)}
  .b .sheen{position:absolute;top:0;left:-60%;width:45%;height:100%;pointer-events:none;
     background:linear-gradient(105deg,transparent,rgba(255,255,255,.14),transparent);
     animation:sweep 4.6s ease-in-out infinite}
  @keyframes sweep{0%,72%{left:-60%}100%{left:130%}}
  .b .ic{width:21px;height:21px;flex:none;stroke:var(--cyan);fill:none;stroke-width:1.7;
         stroke-linecap:round;stroke-linejoin:round;

  .b .t{flex:1;font-size:clamp(13.5px,3.9vw,14.5px);letter-spacing:.05em;font-weight:400}
  .b .ar{width:15px;height:15px;flex:none;stroke:#5f7ba8;fill:none;stroke-width:2;
         stroke-linecap:round;stroke-linejoin:round}

  .foot{width:100%;margin-top:auto;padding-top:30px;display:flex;gap:12px;
        transform:translateZ(6px);animation:rise .6s cubic-bezier(.22,1,.36,1) .38s backwards}
  .mini{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;
        min-height:50px;border-radius:15px;text-decoration:none;color:var(--ink);
        background:linear-gradient(145deg,rgba(132,169,255,.09),rgba(132,169,255,.03));
        border:1px solid var(--line);
        -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
        box-shadow:0 8px 20px -14px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06);
        transition:border-color .18s ease,transform .12s ease}
  .mini:active{transform:scale(.985)}
  @media(hover:hover){.mini:hover{border-color:rgba(67,209,255,.45)}}
  .mini svg{width:17px;height:17px;stroke:var(--cyan);fill:none;stroke-width:1.7;
            stroke-linecap:round;stroke-linejoin:round}
  .mini span{font-size:13.5px;letter-spacing:.06em}

  /* skip control */
  .skip{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;
        display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;
        font:400 11.5px/1 'Poppins',system-ui,sans-serif;letter-spacing:.16em;color:#9fc4e8;
        background:rgba(10,20,38,.55);border:1px solid rgba(132,169,255,.28);
        -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
        cursor:pointer;opacity:0;pointer-events:none;transition:opacity .45s ease}
  body.go .skip{opacity:1;pointer-events:auto;transition-delay:.7s}
  body.skipped .skip,body.arrived .skip{opacity:0;pointer-events:none;transition-delay:0s}
  .skip svg{width:12px;height:12px;stroke:#9fc4e8;fill:none;stroke-width:2;
            stroke-linecap:round;stroke-linejoin:round}
  body.skipped .stage{animation:none!important;opacity:1;filter:none;transform:none}
  body.skipped .flash,body.skipped .wave{animation:none!important;opacity:0}

  .lang{position:fixed;left:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;
        display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;
        font:500 12px/1 'Poppins',system-ui,sans-serif;letter-spacing:.10em;color:#9fc4e8;
        background:rgba(10,20,38,.55);border:1px solid rgba(132,169,255,.28);
        -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
        cursor:pointer;opacity:0;pointer-events:none;transition:opacity .45s ease}
  body.arrived .lang{opacity:1;pointer-events:auto}
  @media(hover:hover){.lang:hover{border-color:rgba(67,209,255,.5);color:#dbeeff}}

  body.ar .name,body.ar .role,body.ar .b .t,body.ar .mini span{font-family:'Tajawal','Poppins',system-ui,sans-serif}
  body.ar .name{letter-spacing:.02em;font-weight:700}
  body.ar .role{letter-spacing:.06em;font-style:normal}
  body.ar .b{flex-direction:row-reverse}
  body.ar .b .t{text-align:right;letter-spacing:0;font-size:clamp(14px,4.1vw,15.5px)}
  body.ar .b .ar{transform:scaleX(-1)}
  body.ar .b .sheen{left:auto;right:-60%}
  body.ar .mini span{letter-spacing:0;font-size:14px}
  body.ar .lang{font-family:'Tajawal','Poppins',sans-serif}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>

<script>
(function(){
"use strict";
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ==========================================================================
   ONE SHOT · ONE CONSTANT SPEED · NO STOPS · NO EMPTY FRAME
   white light = one dot of the QR -> the QR -> the card it is printed on
   -> the card is one of hundreds of identical cards that draw the HR mark
   -> the mark settles, breathes, scatters and re-forms.
   ========================================================================== */
var QRB = "1111111001100111111010111111110000010101011011101101000001101110100011000000011010111011011101011110001110010101110110111010111000110011001011101100000100110000010000010000011111111010101010101010111111100000000111000010000000000000010111101010011110101110110101010110100110000111100011000010110110011100010110001001100111111011100100001010110010000111111010110001000110110100100000001001110111100101011101010000100111000001011000100011010100100111111111010011110000101011111100011100100100001111111011011011011111000111001101011101011001010101000000111001001101101100011000011100111110111111010111011111111000000000011010011001110001000011111110001001011111101010110100000101100011001001000110001011101011001101111111111101110111010110000101101010000010101110100011110010110001101111000001010110101001001011110111111110000110001001111110000", QN = 29;
var cv = document.getElementById('gl'), gl = null;
try{
  gl = cv.getContext('webgl',{alpha:true,antialias:false,premultipliedAlpha:false,powerPreference:'high-performance'})
    || cv.getContext('experimental-webgl');
}catch(e){}

var MOD   = 72.391/QN;
var CARDW = 336/MOD, CARDH = 192/MOD;
var CARDC = [ (168 - 101.315)/MOD, (96 - 102.177)/MOD ];
var PITCH = CARDW * 1.30;
var GW = 64;

var PVS = [
'precision highp float;',
'attribute vec2 aPos; attribute vec4 aMeta;',
'uniform vec2 uRes; uniform vec2 uAnchor; uniform float uScale; uniform float uDPR;',
'uniform float uTime; uniform vec2 uA; uniform float uIdle; uniform vec2 uStart;',
'uniform float uAmp; uniform float uBloom;',
'uniform vec2 uTouch; uniform float uTouchOn;',
'varying float vA; varying float vSeed;',
'void main(){',
'  float lvl = aMeta.x, sd = aMeta.y, ang = aMeta.z, rad = aMeta.w;',
'  float dim = lvl < 0.5 ? (ang > 0.5 ? 1.0 : 0.30) : 1.0;',
'  bool isStar = lvl > 1.5;',
'  float a     = isStar ? (0.26 + sd*0.42) : (lvl < 0.5 ? uA.x : uA.y);',
'  float pitch = lvl < 0.5 ? 1.0  : PITCHV;',
'  vec2 w = aPos;',
// after the camera settles the mark breathes: it scatters and re-forms
'  if(uBloom > 0.5 && !(lvl > 0.5 && lvl < 1.5)){ gl_Position = vec4(2.0,2.0,2.0,1.0); gl_PointSize = 0.0; return; }',
'  if(lvl > 0.5) w += vec2(cos(ang), sin(ang)) * uIdle * rad * PITCHV * uAmp;',
'  vec2 sp;',
'  if(isStar){',
'    sp = uRes*0.5 + w + vec2(sin(uTime*0.09 + sd*33.0), cos(uTime*0.07 + ang*21.0)) * 9.0;',
'  } else {',
'    sp = uAnchor + (w - uStart) * uScale;',
'  }',
'  vec2 dd = sp - uTouch;',
'  sp += normalize(dd + 0.0001) * uTouchOn * smoothstep(110.0, 0.0, length(dd)) * 34.0;',
'  gl_Position = vec4(sp.x/uRes.x*2.0 - 1.0, 1.0 - sp.y/uRes.y*2.0, 0.0, 1.0);',
'  float mx = lvl < 0.5 ? 260.0 : 30.0;',
'  gl_PointSize = isStar ? max(1.0, (0.9 + sd*1.5) * uDPR) : max(1.0, clamp(pitch * uScale * 0.60, 2.6, mx) * uDPR * (uBloom > 0.5 ? 3.6 : 1.0));',
'  float live = lvl < 0.5 ? 1.0 : (0.80 + 0.20*sin(uTime*0.55 + sd*41.0));',
'  vA = isStar ? a : (a * live * dim * (uBloom > 0.5 ? 0.17 : 1.0)); vSeed = sd;',
'}'].join('\n');

var PFS = [
'precision highp float;',
'varying float vA; varying float vSeed;',
'void main(){',
'  vec2 uv = gl_PointCoord - 0.5;',
'  float r = length(uv);',
'  if(r > 0.5) discard;',
'  float a = smoothstep(0.5, 0.02, r) * vA;',
'  if(a < 0.004) discard;',
'  vec3 col = mix(vec3(0.44,0.70,1.00), vec3(0.94,0.99,1.00), vSeed);',
'  col = mix(col, vec3(1.0), pow(a, 4.0)*0.75);',
'  gl_FragColor = vec4(col * a, a);',
'}'].join('\n');

var CVS = [
'precision highp float;',
'attribute vec2 aPos; attribute vec2 aUV;',
'uniform vec2 uRes; uniform vec2 uAnchor; uniform float uScale; uniform vec2 uStart;',
'varying vec2 vUV;',
'void main(){',
'  vec2 sp = uAnchor + (aPos - uStart) * uScale;',
'  gl_Position = vec4(sp.x/uRes.x*2.0 - 1.0, 1.0 - sp.y/uRes.y*2.0, 0.0, 1.0);',
'  vUV = aUV;',
'}'].join('\n');
var CFS = [
'precision highp float;',
'uniform sampler2D uTex; uniform float uCA;',
'varying vec2 vUV;',
'void main(){ vec4 t = texture2D(uTex, vUV); gl_FragColor = vec4(t.rgb*t.a*uCA, t.a*uCA); }'].join('\n');

var WVS = ['precision highp float;','attribute vec2 aQuad;','varying vec2 vQ;',
'void main(){ vQ = aQuad; gl_Position = vec4(aQuad, 0.0, 1.0); }'].join('\n');
var WFS = ['precision highp float;','varying vec2 vQ;',
'uniform float uWA; uniform vec2 uRes; uniform vec2 uAnchor; uniform float uR;',
'void main(){',
'  vec2 sc = (vQ*0.5 + 0.5) * uRes; sc.y = uRes.y - sc.y;',
'  float d = length(sc - uAnchor) / uR;',
'  float a = uWA * (1.0 - smoothstep(0.55, 1.35, d));',
'  if(a < 0.004) discard;',
'  gl_FragColor = vec4(vec3(1.0)*a, a);',
'}'].join('\n');

var SVS = [
'precision highp float;',
'attribute vec3 aStk; attribute float aEnd;',
'uniform vec2 uRes; uniform float uTime; uniform float uSpeed;',
'varying float vA;',
'void main(){',
'  float y   = (aStk.x*2.0 - 1.0) * uRes.y * 0.58;',
'  float sgn = aStk.z < 0.5 ? -1.0 : 1.0;',
'  float d   = fract(aStk.y + uTime * (0.30 + aStk.z*0.85) * (0.20 + uSpeed*1.3));',
'  float x   = sgn * d * uRes.x * 0.74;',
'  float len = uSpeed * (30.0 + aStk.z*250.0) * (0.25 + d*1.3);',
'  x += aEnd * len * 0.5 * sgn;',
'  vec2 sp = uRes*0.5 + vec2(x, y);',
'  gl_Position = vec4(sp.x/uRes.x*2.0 - 1.0, 1.0 - sp.y/uRes.y*2.0, 0.0, 1.0);',
'  vA = uSpeed * (0.13 + aStk.z*0.40) * smoothstep(0.0, 0.16, d) * (1.0 - d*0.85);',
'}'].join('\n');
var SFS = ['precision highp float;','varying float vA;',
'void main(){ if(vA < 0.004) discard; gl_FragColor = vec4(vec3(0.58,0.84,1.0)*vA, vA); }'].join('\n');

function sh(t2, src){
  var o = gl.createShader(t2); gl.shaderSource(o, src); gl.compileShader(o);
  if(!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o));
  return o;
}
function link(v, f){
  var p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, v));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, f));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

/* the real card back — QR included, so every card looks identical */
function cardTexture(){
  var S = 5, c = document.createElement('canvas');
  c.width = 336*S; c.height = 192*S;
  var x = c.getContext('2d'), W2 = c.width, H2 = c.height;
  x.fillStyle = '#000103'; x.fillRect(0,0,W2,H2);
  x.save(); x.translate(W2*0.80, H2*0.30); x.rotate(-Math.PI/4);
  var g1 = x.createLinearGradient(-W2*0.30,0,W2*0.30,0);
  g1.addColorStop(0,'rgba(1,24,106,0)'); g1.addColorStop(0.34,'rgba(46,106,158,0.85)');
  g1.addColorStop(0.60,'rgba(150,190,220,0.95)'); g1.addColorStop(1,'rgba(1,24,106,0)');
  x.fillStyle = g1; x.fillRect(-W2*0.30,-H2*1.1,W2*0.60,H2*2.2); x.restore();
  x.save(); x.translate(W2*0.62, H2*0.12); x.rotate(-Math.PI/4);
  var g2 = x.createLinearGradient(0,-H2,0,H2);
  g2.addColorStop(0,'rgba(67,209,255,0)'); g2.addColorStop(0.5,'rgba(120,225,255,0.9)');
  g2.addColorStop(1,'rgba(67,209,255,0)');
  x.fillStyle = g2; x.fillRect(-1.8*S,-H2,3.6*S,H2*2); x.restore();
  x.textBaseline='middle'; x.textAlign='left'; x.fillStyle='#84a9ff';
  x.font = '700 ' + (9.16*S) + 'px Poppins, system-ui, sans-serif';
  var msg='SCAN TO SEE WHAT I BUILD', tx=19.2*S, ty=39.3*S, ls=1.44*S, i;
  for(i=0;i<msg.length;i++){ x.fillText(msg[i],tx,ty); tx += x.measureText(msg[i]).width + ls; }
  var g3 = x.createLinearGradient(58*S,0,145*S,0);
  g3.addColorStop(0,'rgba(1,62,106,0)'); g3.addColorStop(0.32,'rgba(67,209,255,0.95)');
  g3.addColorStop(0.72,'rgba(65,154,214,0.7)'); g3.addColorStop(1,'rgba(1,24,106,0)');
  x.fillStyle=g3; x.fillRect(58*S,53*S,87*S,1.2*S);
  x.font = '700 ' + (8*S) + 'px Poppins, system-ui, sans-serif';
  x.fillStyle = '#84a9ff';
  function spaced(txt,cx,cy,sp){
    var w=0,j; for(j=0;j<txt.length;j++) w += x.measureText(txt[j]).width + sp;
    var px = cx - (w-sp)/2;
    for(j=0;j<txt.length;j++){ x.fillText(txt[j],px,cy); px += x.measureText(txt[j]).width + sp; }
  }
  spaced('People build companies',104*S,155*S,2.26*S);
  spaced('We build people',101*S,168*S,3.06*S);
  // the code itself, so a distant card is a complete card
  var qx = (101.315 - 72.391/2)*S, qy = (102.177 - 72.391/2)*S, m = 72.391*S/QN;
  x.fillStyle = 'rgba(215,238,255,0.92)';
  for(var r2=0;r2<QN;r2++) for(var c2=0;c2<QN;c2++)
    if(QRB.charCodeAt(r2*QN+c2) === 49) x.fillRect(qx + c2*m, qy + r2*m, m*1.02, m*1.02);

  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  return tex;
}

function hrCells(){
  var c = document.createElement('canvas');
  c.width = GW; c.height = Math.round(GW*0.60);
  var x = c.getContext('2d');
  x.fillStyle='#fff'; x.textAlign='center'; x.textBaseline='middle';
  var fs = Math.round(c.height*0.99);
  x.font = '700 ' + fs + 'px Poppins, system-ui, sans-serif';
  x.fillText('HR', c.width/2, c.height/2 + fs*0.02);
  var d = x.getImageData(0,0,c.width,c.height).data, cells=[];
  for(var yy=0; yy<c.height; yy++) for(var xx=0; xx<c.width; xx++)
    if(d[(yy*c.width+xx)*4+3] > 120) cells.push(xx, yy);
  return { cells: cells, w: c.width, h: c.height };
}

/* -------------------------------- state -------------------------------- */
var pProg,cProg,wProg,sProg, PU={},CU={},WU={},SU={};
var posBuf,metaBuf,cardBuf,quadBuf,stkBuf, cardTex, N=0, CN=0, SN=0;
var W=0,H=0,DPR=1, anchor=[0,0], markC=[0,0], t0=performance.now(), raf=null;
var touch=[-9999,-9999], touchOn=0;
var markEl = document.querySelector('.hr');

var INTRO = 10.2, TRAVEL = 9.5;
var S0 = 2600, S_END = 0.02, RATE = 1;
var scale = S0, settle = 0, speed = 1, whiteA = 1, cardsA = 0, idle = 0, amp = 1.15;
var A = [1,0], START = [0,0], startW = 1;
var skipped = false;

function seg(v,a,b){ return Math.max(0, Math.min(1,(v-a)/(b-a))); }
function smooth(x){ return x*x*(3-2*x); }

function build(){
  var r = markEl.getBoundingClientRect();
  markC = [r.left + r.width/2, r.top + r.height/2];

  var lit=[], dark=[], y, x2, i;
  for(y=0;y<QN;y++) for(x2=0;x2<QN;x2++){
    if(QRB.charCodeAt(y*QN+x2) === 49) lit.push(x2, y); else dark.push(x2, y);
  }
  var nLit = lit.length/2, nDark = dark.length/2;
  var isOn = function(cx,cy){
    if(cx<0||cy<0||cx>=QN||cy>=QN) return 0;
    return QRB.charCodeAt(cy*QN+cx) === 49 ? 1 : 0;
  };
  var bs=-1, bxs=14, bys=14;
  for(var sy=0; sy<QN; sy++) for(var sx=0; sx<QN; sx++){
    if(!isOn(sx,sy)) continue;
    var sc = 0;
    for(var oy=-1; oy<=1; oy++) for(var ox=-1; ox<=1; ox++) sc += isOn(sx+ox, sy+oy);
    sc = sc*10 - (Math.abs(sx-14) + Math.abs(sy-14));
    if(sc > bs){ bs = sc; bxs = sx; bys = sy; }
  }
  START = [ bxs - QN/2 + 0.5, bys - QN/2 + 0.5 ];

  var hd = hrCells(), hc = hd.cells, nH = hc.length/2;
  var best=0, bd=1e9, cx0=hd.w/2, cy0=hd.h/2;
  for(i=0;i<nH;i++){
    var dx=hc[i*2]-cx0, dy=(hc[i*2+1]-cy0)*1.6, dd2=dx*dx+dy*dy;
    if(dd2<bd){ bd=dd2; best=i; }
  }
  var bx=hc[best*2], by=hc[best*2+1];

  var targetW = Math.min(Math.max(window.innerWidth, 320) * 0.55, 235);
  S_END = targetW / (hd.w * PITCH);
  RATE  = Math.log(S0 / S_END) / TRAVEL;

  var big = (W*H > 900*900);
  var PER = big ? 170 : 120;          // enough grains that one module reads as solid light
  var HPER = big ? 8 : 6;

  var pos=[], meta=[];
  for(i=0;i<nLit;i++) for(var k=0;k<PER;k++){
    pos.push(lit[i*2] - QN/2 + 0.04 + Math.random()*0.92,
             lit[i*2+1] - QN/2 + 0.04 + Math.random()*0.92);
    meta.push(0, Math.random(), 1, 0);
  }
  var DPER = Math.round(PER*0.30);
  for(i=0;i<nDark;i++) for(var kd=0;kd<DPER;kd++){
    pos.push(dark[i*2] - QN/2 + 0.04 + Math.random()*0.92,
             dark[i*2+1] - QN/2 + 0.04 + Math.random()*0.92);
    meta.push(0, Math.random(), 0, 0);
  }
  var cards=[];
  for(i=0;i<nH;i++){
    var hx = CARDC[0] + (hc[i*2]-bx)*PITCH, hy = CARDC[1] + (hc[i*2+1]-by)*PITCH;
    for(var k2=0;k2<HPER;k2++){
      pos.push(hx + (Math.random()-0.5)*PITCH*0.30, hy + (Math.random()-0.5)*PITCH*0.30);
      meta.push(1, Math.random(), Math.random()*6.2832, 0.35 + Math.random()*1.5);
    }
    var L2=hx-CARDW/2, R2=hx+CARDW/2, T2=hy-CARDH/2, B2=hy+CARDH/2;
    cards.push(L2,T2,0,0,  R2,T2,1,0,  L2,B2,0,1,
               R2,T2,1,0,  R2,B2,1,1,  L2,B2,0,1);
  }
  var STARS = big ? 420 : 300;
  for(i=0;i<STARS;i++){
    pos.push((Math.random()-0.5)*W*1.25, (Math.random()-0.5)*H*1.25);
    meta.push(2, Math.random(), Math.random()*6.2832, 0);
  }
  N = pos.length/2; CN = cards.length/4;

  gl.useProgram(pProg);
  if(!posBuf) posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos), gl.STATIC_DRAW);
  if(!metaBuf) metaBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, metaBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(meta), gl.STATIC_DRAW);
  if(!cardBuf) cardBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, cardBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(cards), gl.STATIC_DRAW);

  var ST=170, sd=[];
  for(var s2=0;s2<ST;s2++){
    var yy=Math.random(), ph=Math.random(), sg=Math.random();
    sd.push(yy,ph,sg,-1, yy,ph,sg,1);
  }
  SN = ST*2;
  if(!stkBuf) stkBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, stkBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(sd), gl.STATIC_DRAW);
}

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  gl.viewport(0,0,cv.width,cv.height);
  build();
}

function timeline(t){
  if(t < TRAVEL){
    var L = Math.log(S0/S_END), EASE = 0.65, T1 = TRAVEL - EASE;
    var R = L / (TRAVEL - EASE*0.5);
    var d = t <= T1 ? R*t : R*(T1 + (t-T1) - (t-T1)*(t-T1)/(2*EASE));
    scale = S0 * Math.exp(-Math.min(L, d));
    speed = t <= T1 ? 1 : Math.max(0, 1 - (t-T1)/EASE);
    idle = smooth(seg(t, TRAVEL-2.4, TRAVEL-1.5)) * (1 - smooth(seg(t, TRAVEL-1.5, TRAVEL+0.5)));
    amp = 1.15;
  }
  else if(t < INTRO){ scale = S_END; speed = 1 - smooth(seg(t, TRAVEL, INTRO));
    idle = 1 - smooth(seg(t, TRAVEL-1.5, TRAVEL+0.5)); amp = 1.15; }
  else {
    scale = S_END; speed = 0;
    var ph = (t - INTRO) % 4.3;      // the drift itself is slow; the pause between is short
    idle = ph < 1.5 ? smooth(ph/1.5)
         : (ph < 3.5 ? 1 - smooth((ph-1.5)/2.0) : 0);
    amp = 2.1;
  }
  settle = smooth(seg(t, TRAVEL-1.2, INTRO));
  startW = smooth(seg(scale, 16, 300));
  A[0]   = smooth(seg(scale, 1.0, 3.0));
  cardsA = smooth(seg(scale*CARDW, 6.0, 15.0));
  A[1]   = Math.max(smooth(1 - seg(scale*CARDW, 7.0, 30.0)), 0.0);
  anchor = [ W*0.5 + (markC[0]-W*0.5)*settle, H*0.5 + (markC[1]-H*0.5)*settle ];
}

function frame(){
  var t = (performance.now()-t0)/1000;
  timeline(t);
  gl.clear(gl.COLOR_BUFFER_BIT);

  if(cardsA > 0.004 && cardTex && CN){
    gl.useProgram(cProg);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindBuffer(gl.ARRAY_BUFFER, cardBuf);
    var LP = gl.getAttribLocation(cProg,'aPos'), LU = gl.getAttribLocation(cProg,'aUV');
    gl.enableVertexAttribArray(LP); gl.vertexAttribPointer(LP,2,gl.FLOAT,false,16,0);
    gl.enableVertexAttribArray(LU); gl.vertexAttribPointer(LU,2,gl.FLOAT,false,16,8);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, cardTex);
    gl.uniform1i(CU.uTex,0);
    gl.uniform2f(CU.uRes,W,H); gl.uniform2f(CU.uAnchor,anchor[0],anchor[1]);
    gl.uniform1f(CU.uScale,scale); gl.uniform1f(CU.uCA,cardsA);
    gl.uniform2f(CU.uStart, START[0]*startW, START[1]*startW);
    gl.drawArrays(gl.TRIANGLES,0,CN);
    gl.disableVertexAttribArray(LP); gl.disableVertexAttribArray(LU);
  }

  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

  if(speed > 0.01){
    gl.useProgram(sProg);
    gl.bindBuffer(gl.ARRAY_BUFFER, stkBuf);
    var LS = gl.getAttribLocation(sProg,'aStk'), LE = gl.getAttribLocation(sProg,'aEnd');
    gl.enableVertexAttribArray(LS); gl.vertexAttribPointer(LS,3,gl.FLOAT,false,16,0);
    gl.enableVertexAttribArray(LE); gl.vertexAttribPointer(LE,1,gl.FLOAT,false,16,12);
    gl.uniform2f(SU.uRes,W,H); gl.uniform1f(SU.uTime,t); gl.uniform1f(SU.uSpeed,speed);
    gl.drawArrays(gl.LINES,0,SN);
    gl.disableVertexAttribArray(LS); gl.disableVertexAttribArray(LE);
  }

  gl.useProgram(pProg);
  var LA = gl.getAttribLocation(pProg,'aPos'), LM = gl.getAttribLocation(pProg,'aMeta');
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.enableVertexAttribArray(LA); gl.vertexAttribPointer(LA,2,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER, metaBuf);
  gl.enableVertexAttribArray(LM); gl.vertexAttribPointer(LM,4,gl.FLOAT,false,0,0);
  gl.uniform2f(PU.uRes,W,H); gl.uniform2f(PU.uAnchor,anchor[0],anchor[1]);
  gl.uniform1f(PU.uScale,scale); gl.uniform1f(PU.uDPR,DPR); gl.uniform1f(PU.uTime,t);
  gl.uniform2f(PU.uStart, START[0]*startW, START[1]*startW);
  gl.uniform1f(PU.uAmp, amp);
  gl.uniform1f(PU.uBloom, 0);
  gl.uniform2f(PU.uA, A[0], A[1]); gl.uniform1f(PU.uIdle, idle);
  gl.uniform2f(PU.uTouch,touch[0],touch[1]); gl.uniform1f(PU.uTouchOn,touchOn);
  gl.drawArrays(gl.POINTS,0,N);
  if(A[1] > 0.01){
    gl.uniform1f(PU.uBloom, 1);
    gl.drawArrays(gl.POINTS,0,N);
    gl.uniform1f(PU.uBloom, 0);
  }

  touchOn *= 0.94;
  raf = requestAnimationFrame(frame);
}

function doSkip(){
  if(skipped) return;
  skipped = true;
  t0 = performance.now() - INTRO*1000;
  document.body.classList.add('skipped');
  document.body.classList.add('arrived');
  var st = document.querySelector('.stage'); if(st) st.classList.remove('pre');
  scale = S_END; settle = 1; speed = 0; whiteA = 0; cardsA = 0; idle = 0;
}
var skipBtn = document.getElementById('skip');
if(skipBtn) skipBtn.addEventListener('click', doSkip);

if(gl && !reduce){
  try{
    pProg = link(PVS.replace(/PITCHV/g, String(PITCH)), PFS);
    cProg = link(CVS, CFS);
    wProg = link(WVS, WFS);
    sProg = link(SVS, SFS);
    ['uRes','uAnchor','uScale','uDPR','uTime','uA','uIdle','uStart','uAmp','uBloom','uTouch','uTouchOn']
      .forEach(function(k){ PU[k] = gl.getUniformLocation(pProg,k); });
    ['uRes','uAnchor','uScale','uTex','uCA','uStart'].forEach(function(k){ CU[k] = gl.getUniformLocation(cProg,k); });
    ['uWA','uRes','uAnchor','uR'].forEach(function(k){ WU[k] = gl.getUniformLocation(wProg,k); });
    ['uRes','uTime','uSpeed'].forEach(function(k){ SU[k] = gl.getUniformLocation(sProg,k); });
    quadBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND); gl.clearColor(0,0,0,0);

    var go = function(){
      document.body.classList.add('gpu');
      resize();
      cardTex = cardTexture();
      cv.classList.add('on');
      t0 = performance.now();
      requestAnimationFrame(function(){
        var st = document.querySelector('.stage'); if(st) st.classList.remove('pre');
        document.body.classList.add('go');
      });
      setTimeout(function(){ document.body.classList.add('arrived'); }, INTRO*1000 + 300);
      frame();
    };
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(go).catch(go);
    else go();

    var rt;
    window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(resize,160); }, {passive:true});
    window.addEventListener('scroll', function(){
      var rr = markEl.getBoundingClientRect();
      markC = [rr.left + rr.width/2, rr.top + rr.height/2];
    }, {passive:true});
    document.addEventListener('visibilitychange', function(){
      if(document.hidden){ if(raf){cancelAnimationFrame(raf); raf=null;} }
      else if(!raf){ raf = requestAnimationFrame(frame); }
    });
    window.addEventListener('pointermove', function(e){ touch=[e.clientX,e.clientY]; touchOn=1; }, {passive:true});
    window.addEventListener('touchmove', function(e){
      var pt=e.touches[0]; if(!pt) return; touch=[pt.clientX,pt.clientY]; touchOn=1;
    }, {passive:true});
  }catch(err){ if(skipBtn) skipBtn.style.display='none'; doSkip(); }
} else { if(skipBtn) skipBtn.style.display='none'; doSkip(); }

    document.title = d.title;
    var nm = document.querySelector('.name');
    if(nm) nm.innerHTML = '<span></span>';
    if(nm){ nm.firstChild.textContent = d.name; nm.appendChild(document.createTextNode(d.last)); }
    var rl = document.querySelector('.role'); if(rl) rl.textContent = d.role;
    var ts = document.querySelectorAll('.btns .b .t');
    for(var i=0;i<ts.length && i<d.b.length;i++) ts[i].textContent = d.b[i];
    var ms = document.querySelectorAll('.foot .mini span');
    for(var j=0;j<ms.length && j<d.m.length;j++) ms[j].textContent = d.m[j];
    if(btn) btn.textContent = d.other;
    try{ localStorage.setItem('fa-lang', l); }catch(e){}
    cur = l;
  }
  if(btn) btn.addEventListener('click', function(){ apply(cur === 'en' ? 'ar' : 'en'); });
  if(cur === 'ar') apply('ar'); else apply('en');
})();

/* --------------------------- parallax tilt ----------------------------- */
var el = document.getElementById('tilt'), tx=0, ty=0, cx=0, cy=0, idl=0, active=false;
function loop(){
  idl += 0.012;
  var ix = active?0:Math.sin(idl)*1.6, iy = active?0:Math.cos(idl*0.8)*1.1;
  cx += ((tx+ix)-cx)*0.075; cy += ((ty+iy)-cy)*0.075;
  el.style.transform = 'rotateY('+cx.toFixed(2)+'deg) rotateX('+(-cy).toFixed(2)+'deg)';
  requestAnimationFrame(loop);
}
if(!reduce) requestAnimationFrame(loop);
window.addEventListener('pointermove', function(e){
  if(e.pointerType==='touch') return;
  active = true;
  tx = ((e.clientX/window.innerWidth)-.5)*11;
  ty = ((e.clientY/window.innerHeight)-.5)*8;
}, {passive:true});
function onOrient(e){
  if(e.gamma==null && e.beta==null) return;
  active = true;
  tx = Math.max(-12, Math.min(12, (e.gamma||0)*0.42));
  ty = Math.max(-9,  Math.min(9,  ((e.beta||0)-45)*0.20));
}
if(window.DeviceOrientationEvent && !reduce){
  if(typeof DeviceOrientationEvent.requestPermission === 'function'){
    var asked=false;
    document.addEventListener('touchend', function(){
      if(asked) return; asked=true;
      DeviceOrientationEvent.requestPermission().then(function(r){
        if(r==='granted') window.addEventListener('deviceorientation', onOrient, {passive:true});
      }).catch(function(){});
    }, {passive:true});
  } else { window.addEventListener('deviceorientation', onOrient, {passive:true}); }
}
})();
</script>
