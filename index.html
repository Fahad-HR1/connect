<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;
            -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  :root{

  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100dvh; background:var(--bg); color:var(--ink);
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased; position:relative; overflow-x:hidden;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(58px + env(safe-area-inset-top,0px)) 24px calc(30px + env(safe-area-inset-bottom,0px));
    perspective:1100px;
  }

  /* GPU particle field + morphing HR mark */
  #gl{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;
      opacity:0;transition:opacity .9s ease .15s}
  #gl.on{opacity:1}

  .st{position:fixed;pointer-events:none;z-index:0}
  .s1{top:-14vh;left:-24vw;width:60vw;height:70vh;transform:rotate(45deg);
      background:linear-gradient(180deg,rgba(1,62,106,0),rgba(3,70,140,.45),rgba(1,24,106,0))}
  .s2{top:-8vh;left:2vw;width:3px;height:58vh;transform:rotate(45deg);opacity:.45;
      background:linear-gradient(180deg,transparent,var(--glow),transparent)}
  .s3{bottom:-20vh;right:-28vw;width:66vw;height:74vh;transform:rotate(45deg);
      background:linear-gradient(180deg,rgba(1,62,106,0),rgba(3,70,140,.4),rgba(1,24,106,0))}
  .s4{bottom:-12vh;right:5vw;width:3px;height:56vh;transform:rotate(45deg);opacity:.4;
      background:linear-gradient(180deg,transparent,var(--glow),transparent)}

  .wrap{position:relative;z-index:2;width:100%;max-width:420px;
        display:flex;flex-direction:column;align-items:center;flex:1;
        transform-style:preserve-3d}
  /* the camera pull-back : everything rushes back into place on load */
  .stage{width:100%;display:flex;flex-direction:column;align-items:center;flex:1;
         transform-style:preserve-3d;
         animation:pullback 4.1s cubic-bezier(.12,.75,.12,1) both}
  .stage.pre{animation:none;opacity:0}
  @keyframes pullback{
    0%  {opacity:0; filter:blur(30px); transform:scale(4.2)  translateY(110px) rotate(7deg)}
    58% {opacity:0}
    82% {opacity:1; filter:blur(5px)}
    100%{opacity:1; filter:blur(0);    transform:scale(1) translateY(0) rotate(0)}
  }
  /* impact beat when the letters lock in */
  .flash{position:fixed;inset:0;z-index:3;pointer-events:none;background:#bfeaff;
         opacity:0;mix-blend-mode:screen}
  body.go .flash{animation:flash 1.1s ease-out 3.30s both}
  @keyframes flash{0%{opacity:0}16%{opacity:.17}100%{opacity:0}}
  .wave{position:fixed;left:50%;top:26%;z-index:3;pointer-events:none;
        width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
        border:2px solid rgba(127,211,245,.9);opacity:0}
  body.go .wave{animation:wave 1.7s cubic-bezier(.16,1,.3,1) 3.35s both}
  body.go .wave.b{animation-delay:3.52s;border-color:rgba(132,169,255,.6)}
  @keyframes wave{
    0%{opacity:.95; transform:scale(.2)}
    100%{opacity:0; transform:scale(34)}
  }

  .markbox{position:relative;transform-style:preserve-3d}
  .hr,.hrback{font-weight:700;font-size:clamp(54px,17vw,72px);line-height:1;
      letter-spacing:.04em;white-space:nowrap}
  .hr{position:relative;z-index:2;
      background:linear-gradient(180deg,#ffffff,#d6f2ff 28%,#7fd3f5 60%,#43d1ff);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      transform:translateZ(46px);animation:float 5.5s ease-in-out infinite}
  .hrback{position:absolute;left:0;top:0;z-index:1;color:#0f4a86;
      transform:translateZ(30px);animation:floatb 5.5s ease-in-out infinite;
      text-shadow:1px 1px 0 #14508f,2px 2px 0 #124883,3px 3px 0 #0f3f74,

  @keyframes floatb{0%,100%{transform:translateZ(30px) translateY(0)}50%{transform:translateZ(30px) translateY(-6px)}}

  .btns{width:100%;margin-top:auto;padding-top:34px;display:flex;flex-direction:column;gap:12px;
        transform-style:preserve-3d}

  @media(hover:hover){.b:hover{border-color:rgba(67,209,255,.5);

  .b .ic{width:21px;height:21px;flex:none;stroke:var(--cyan);fill:none;stroke-width:1.7;

  .b .t{flex:1;font-size:clamp(13.5px,3.9vw,14.5px);letter-spacing:.05em;font-weight:400}
  .b .ar{width:15px;height:15px;flex:none;stroke:#5f7ba8;fill:none;stroke-width:2;

  .foot{width:100%;margin-top:auto;padding-top:30px;display:flex;gap:12px;

  .mini{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;
        min-height:50px;border-radius:15px;text-decoration:none;color:var(--ink);
        background:linear-gradient(145deg,rgba(132,169,255,.09),rgba(132,169,255,.03));
        border:1px solid var(--line);
        -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
        box-shadow:0 8px 20px -14px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06);
        transition:border-color .18s ease,transform .12s ease}
  .mini:active{transform:scale(.985)}
  @media(hover:hover){.mini:hover{border-color:rgba(67,209,255,.45)}}
  .mini svg{width:17px;height:17px;stroke:var(--cyan);fill:none;stroke-width:1.7;
            stroke-linecap:round;stroke-linejoin:round}
  .mini span{font-size:13.5px;letter-spacing:.06em}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>

<script>
(function(){
"use strict";
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ============================================================
   One continuous camera pull-back:
     a point of light  ->  Fahad's actual QR code
                       ->  a network of connected people
                       ->  the letters HR  ->  the lobby
   Pure WebGL, no library.
   ============================================================ */
var QR = "1111111001100111111010111111110000010101011011101101000001101110100011000000011010111011011101011110001110010101110110111010111000110011001011101100000100110000010000010000011111111010101010101010111111100000000111000010000000000000010111101010011110101110110101010110100110000111100011000010110110011100010110001001100111111011100100001010110010000111111010110001000110110100100000001001110111100101011101010000100111000001011000100011010100100111111111010011110000101011111100011100100100001111111011011011011111000111001101011101011001010101000000111001001101101100011000011100111110111111010111011111111000000000011010011001110001000011111110001001011111101010110100000101100011001001000110001011101011001101111111111101110111010110000101101010000010101110100011110010110001101111000001010110101001001011110111111110000110001001111110000", QN = 29;

var cv = document.getElementById('gl'), gl = null;
try{
  gl = cv.getContext('webgl',{alpha:true,antialias:false,premultipliedAlpha:false,powerPreference:'high-performance'})
    || cv.getContext('experimental-webgl');
}catch(e){}

/* ---------------- points ---------------- */
var VS = [
'precision highp float;',
'attribute vec2 aQR;',
'attribute vec2 aNet;',
'attribute vec2 aHR;',
'attribute vec3 aStar;',
'attribute vec3 aSeed;',
'uniform vec2  uRes;',
'uniform vec2  uMark;',
'uniform float uTime;',
'uniform float uStage;',
'uniform float uZoom;',
'uniform float uRoll;',
'uniform float uSettle;',
'uniform vec2  uTouch;',
'uniform float uTouchOn;',
'uniform float uDPR;',
'varying float vD;',
'varying float vSeed;',
'varying float vHot;',
'void main(){',
'  float s1 = aSeed.x, s2 = aSeed.y, s3 = aSeed.z;',
'  float amb = step(0.76, s3);',
'  vec3 pos;',
'  float hot = 0.0;',
'  if(amb > 0.5){',
'    pos = aStar;',
'    pos.xy = uRes*0.5 + (pos.xy - uRes*0.5);',
'  } else {',
'    float st = clamp(uStage, 0.0, 3.0);',
'    float i0 = floor(min(st, 2.0));',
'    float f  = st - i0;',
'    f = clamp((f - s1*0.34) / 0.66, 0.0, 1.0);',
'    f = f*f*(3.0-2.0*f);',
'    vec3 pDot = vec3(aQR * 0.030, 0.0);',
'    vec3 pQR  = vec3(aQR, sin(aQR.x*0.09 + aQR.y*0.07)*6.0);',
'    vec3 pNet = vec3(aNet, sin(uTime*0.7 + s1*30.0)*46.0);',
'    vec3 pHR  = vec3(aHR,  sin(uTime*1.15 + aHR.x*0.035 + aHR.y*0.02)*13.0);',
'    vec3 a = i0 < 0.5 ? pDot : (i0 < 1.5 ? pQR  : pNet);',
'    vec3 b = i0 < 0.5 ? pQR  : (i0 < 1.5 ? pNet : pHR );',
'    pos = mix(a, b, f);',
'    hot = (i0 < 1.5 ? (1.0 - f) : 0.0) * step(0.5, st);',
'  }',
// depth + camera
'  float persp = 520.0 / (520.0 + pos.z);',
'  vec2 anchor = mix(uRes*0.5, uMark, uSettle);',
'  vec2 rel = amb > 0.5 ? (pos.xy - uRes*0.5) * persp * uZoom',
'                       : pos.xy * persp * uZoom;',
'  float cr = cos(uRoll), sr = sin(uRoll);',
'  rel = vec2(rel.x*cr - rel.y*sr, rel.x*sr + rel.y*cr);',
'  vec2 sp = (amb > 0.5 ? uRes*0.5 : anchor) + rel;',
// pointer repulsion
'  vec2 d = sp - uTouch;',
'  float dist = length(d);',
'  sp += normalize(d + 0.0001) * uTouchOn * smoothstep(120.0, 0.0, dist) * 44.0;',
'  vec2 clip = vec2(sp.x/uRes.x*2.0 - 1.0, 1.0 - sp.y/uRes.y*2.0);',
'  gl_Position = vec4(clip, 0.0, 1.0);',
'  float base = mix(1.9, 2.9, s2) * mix(1.0, 0.62, amb);',
// close to the subject the grains are physically larger
'  float near = mix(3.1, 1.0, clamp(uStage/2.30, 0.0, 1.0));',
'  if(amb > 0.5) near = mix(1.6, 1.0, clamp(uStage/2.30, 0.0, 1.0));',
'  gl_PointSize = max(1.0, base * persp * uDPR * near);',
'  vD = persp;',
'  vSeed = s2;',
'  vHot = hot;',
'}'].join('\n');

var FS = [
'precision highp float;',
'varying float vD;',
'varying float vSeed;',
'varying float vHot;',
'void main(){',
'  vec2 uv = gl_PointCoord - 0.5;',
'  float r = length(uv);',
'  if(r > 0.5) discard;',
'  float a = smoothstep(0.5, 0.06, r);',
'  vec3 deep = vec3(0.16, 0.38, 0.78);',
'  vec3 lit  = vec3(0.50, 0.86, 1.00);',
'  vec3 col  = mix(deep, lit, clamp((vD-0.62)/0.55, 0.0, 1.0));',
'  col = mix(col, vec3(0.78,0.95,1.0), vHot*0.6);',
'  col = mix(col, vec3(1.0), pow(a, 6.0) * 0.55);',
'  float glow = (0.40 + vD*0.55) * (0.80 + vSeed*0.34);',
'  gl_FragColor = vec4(col * a * glow, a * glow);',
'}'].join('\n');

/* ---------------- network lines ---------------- */
var LVS = [
'precision highp float;',
'attribute vec2 aA;',
'attribute vec2 aB;',
'attribute float aT;',
'uniform vec2  uRes;',
'uniform vec2  uMark;',
'uniform float uStage;',
'uniform float uZoom;',
'uniform float uRoll;',
'uniform float uSettle;',
'uniform float uTime;',
'varying float vA;',
'void main(){',
'  vec2 pos = mix(aA, aB, aT);',
'  vec2 rel = pos * uZoom;',
'  float cr = cos(uRoll), sr = sin(uRoll);',
'  rel = vec2(rel.x*cr - rel.y*sr, rel.x*sr + rel.y*cr);',
'  vec2 sp = mix(uRes*0.5, uMark, uSettle) + rel;',
'  gl_Position = vec4(sp.x/uRes.x*2.0 - 1.0, 1.0 - sp.y/uRes.y*2.0, 0.0, 1.0);',
'  float near = 1.0 - clamp(abs(uStage - 2.0) / 0.72, 0.0, 1.0);',
'  vA = near * 0.85;',
'}'].join('\n');

var LFS = [
'precision highp float;',
'varying float vA;',
'void main(){ gl_FragColor = vec4(vec3(0.40, 0.70, 1.00) * vA, vA); }'].join('\n');

function sh(type, src){
  var o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o);
  if(!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o));
  return o;
}
function link(vs, fs){
  var p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

/* sample "HR" into points, sized to the DOM mark */
function sampleHR(w, h){
  var c = document.createElement('canvas'), S = 2;
  c.width = Math.max(8, Math.round(w*S)); c.height = Math.max(8, Math.round(h*S));
  var x = c.getContext('2d');
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  var fs = Math.round(h*S*0.86);
  x.font = '700 ' + fs + 'px Poppins, system-ui, sans-serif';
  x.fillText('HR', c.width/2, c.height/2 + fs*0.03);
  var d = x.getImageData(0,0,c.width,c.height).data, pts = [];
  for(var yy=0; yy<c.height; yy+=2){
    for(var xx=0; xx<c.width; xx+=2){
      if(d[(yy*c.width+xx)*4+3] > 130){
        pts.push((xx/S - w/2) + (Math.random()-0.5)*1.1,
                 (yy/S - h/2) + (Math.random()-0.5)*1.1);
      }
    }
  }
  return pts;
}

var progP, progL, lp = {}, loc = {}, buf = {}, N = 0, LN = 0;
var W=0, H=0, DPR=1, markC=[0,0], t0=performance.now(), raf=null;
var touch=[-9999,-9999], touchOn=0;
var markEl = document.querySelector('.hr');

var INTRO = 4.2;
var stage = 0, zoom = 6.2, roll = 0.30, settle = 0;
function easeOutQuint(x){ return 1 - Math.pow(1-x, 5); }
function seg(t, a, b){ return Math.max(0, Math.min(1, (t-a)/(b-a))); }
function smooth(x){ return x*x*(3-2*x); }

function build(){
  var r = markEl.getBoundingClientRect();
  var mw = Math.max(80, r.width*1.22), mh = Math.max(50, r.height*1.15);
  markC = [r.left + r.width/2, r.top + r.height/2];

  var hp = sampleHR(mw, mh);
  var max = (W*H > 900*900) ? 24000 : 15000;
  var total = hp.length/2, stride = Math.max(1, Math.ceil(total/max));
  var qr=[], net=[], hr=[], star=[], seed=[];

  // QR geometry: the whole code spans a little wider than the HR mark
  var QS = (mw*1.32) / QN, qOff = -(QN*QS)/2;
  var lit = [];
  for(var yy=0; yy<QN; yy++) for(var xx=0; xx<QN; xx++)
    if(QR.charCodeAt(yy*QN+xx) === 49) lit.push(xx, yy);
  var nLit = lit.length/2;

  // network hubs
  var HUB = 34, hubs = [];
  for(var k=0; k<HUB; k++){
    var ang = (k/HUB)*Math.PI*2 + Math.random()*0.5;
    var rad = (0.34 + Math.pow(Math.random(),0.55)*0.66) * mw*0.98;
    hubs.push([Math.cos(ang)*rad*1.18, Math.sin(ang)*rad*0.80]);
  }

  var i = 0;
  for(var q=0; q<total; q+=stride, i++){
    hr.push(hp[q*2], hp[q*2+1]);

    // QR: spread particles evenly over the lit modules
    var li = (i % nLit) * 2;
    qr.push(qOff + (lit[li]   + 0.15 + Math.random()*0.70) * QS,
            qOff + (lit[li+1] + 0.15 + Math.random()*0.70) * QS);

    // network: cluster particles around hubs
    var hb = hubs[i % HUB], sp = 11 + Math.random()*13, na = Math.random()*Math.PI*2;
    var nr = Math.pow(Math.random(), 0.7) * sp;
    net.push(hb[0] + Math.cos(na)*nr, hb[1] + Math.sin(na)*nr);

    var s3 = Math.random();
    star.push((Math.random()*2.6-0.8)*W, (Math.random()*2.6-0.8)*H,
              Math.pow(Math.random(),0.75)*1500 - 60);
    seed.push(Math.random(), Math.random(), s3);
  }
  N = hr.length/2;

  // line segments between nearby hubs
  var la=[], lb=[], lt=[];
  for(var a1=0; a1<HUB; a1++){
    for(var b1=a1+1; b1<HUB; b1++){
      var dx = hubs[a1][0]-hubs[b1][0], dy = hubs[a1][1]-hubs[b1][1];
      if(dx*dx+dy*dy < 128*128){
        la.push(hubs[a1][0], hubs[a1][1], hubs[a1][0], hubs[a1][1]);
        lb.push(hubs[b1][0], hubs[b1][1], hubs[b1][0], hubs[b1][1]);
        lt.push(0, 1);
      }
    }
  }
  LN = lt.length;

  function up(prog, name, arr, n, store){
    var L = gl.getAttribLocation(prog, name);
    if(L < 0) return;
    if(!buf[store]) buf[store] = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf[store]);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(arr), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(L);
    gl.vertexAttribPointer(L, n, gl.FLOAT, false, 0, 0);
    (store === 'L' ? lp : loc)[name] = L;
  }
  gl.useProgram(progP);
  up(progP,'aQR',  qr,  2,'aQR');
  up(progP,'aNet', net, 2,'aNet');
  up(progP,'aHR',  hr,  2,'aHR');
  up(progP,'aStar',star,3,'aStar');
  up(progP,'aSeed',seed,3,'aSeed');
  pBuf = {qr:buf.aQR, net:buf.aNet, hr:buf.aHR, star:buf.aStar, seed:buf.aSeed};

  gl.useProgram(progL);
  lineData = {a:la, b:lb, t:lt};
  if(!buf.la) { buf.la = gl.createBuffer(); buf.lb = gl.createBuffer(); buf.lt = gl.createBuffer(); }
  gl.bindBuffer(gl.ARRAY_BUFFER, buf.la); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(la), gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, buf.lb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(lb), gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, buf.lt); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(lt), gl.STATIC_DRAW);
}
var pBuf = null, lineData = null;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  gl.viewport(0,0,cv.width,cv.height);
  build();
}

function bindPoints(){
  gl.useProgram(progP);
  function b(name, store, n){
    var L = gl.getAttribLocation(progP, name); if(L<0) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, buf[store]);
    gl.enableVertexAttribArray(L);
    gl.vertexAttribPointer(L, n, gl.FLOAT, false, 0, 0);
  }
  b('aQR','aQR',2); b('aNet','aNet',2); b('aHR','aHR',2);
  b('aStar','aStar',3); b('aSeed','aSeed',3);
}
function bindLines(){
  gl.useProgram(progL);
  function b(name, store, n){
    var L = gl.getAttribLocation(progL, name); if(L<0) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, buf[store]);
    gl.enableVertexAttribArray(L);
    gl.vertexAttribPointer(L, n, gl.FLOAT, false, 0, 0);
  }
  b('aA','la',2); b('aB','lb',2); b('aT','lt',1);
}

function timeline(t){
  if(t < INTRO){
    // ONE continuous retreat; the subject changes scale as we climb out
    var k = easeOutQuint(Math.min(1, t/3.9));
    zoom = 6.2 - 5.2*k;
    roll = 0.30 * (1-k);
    settle = smooth(seg(t, 2.55, 4.05));
    // point -> QR -> network -> HR
    var s;
    if(t < 0.55)      s = 0;
    else if(t < 1.55) s = smooth(seg(t, 0.55, 1.55));
    else if(t < 2.45) s = 1 + smooth(seg(t, 1.55, 2.45));
    else              s = 2 + smooth(seg(t, 2.45, 3.45));
    stage = Math.min(3, s);
  } else {
    zoom += (1-zoom)*0.07; roll *= 0.9; settle += (1-settle)*0.1;
    var ph = (t - INTRO) % 20.0;
    var want = (ph < 15.0) ? 3 : 2;     // HR breathes, then drifts back to the network and returns
    stage += (want - stage) * 0.022;
  }
}

function frame(){
  var t = (performance.now()-t0)/1000;
  timeline(t);
  gl.clear(gl.COLOR_BUFFER_BIT);

  if(LN){
    bindLines();
    gl.uniform2f(gl.getUniformLocation(progL,'uRes'), W, H);
    gl.uniform2f(gl.getUniformLocation(progL,'uMark'), markC[0], markC[1]);
    gl.uniform1f(gl.getUniformLocation(progL,'uStage'), stage);
    gl.uniform1f(gl.getUniformLocation(progL,'uZoom'), zoom);
    gl.uniform1f(gl.getUniformLocation(progL,'uRoll'), roll);
    gl.uniform1f(gl.getUniformLocation(progL,'uSettle'), settle);
    gl.uniform1f(gl.getUniformLocation(progL,'uTime'), t);
    gl.drawArrays(gl.LINES, 0, LN);
  }

  bindPoints();
  gl.uniform2f(gl.getUniformLocation(progP,'uRes'), W, H);
  gl.uniform2f(gl.getUniformLocation(progP,'uMark'), markC[0], markC[1]);
  gl.uniform1f(gl.getUniformLocation(progP,'uTime'), t);
  gl.uniform1f(gl.getUniformLocation(progP,'uStage'), stage);
  gl.uniform1f(gl.getUniformLocation(progP,'uZoom'), zoom);
  gl.uniform1f(gl.getUniformLocation(progP,'uRoll'), roll);
  gl.uniform1f(gl.getUniformLocation(progP,'uSettle'), settle);
  gl.uniform2f(gl.getUniformLocation(progP,'uTouch'), touch[0], touch[1]);
  gl.uniform1f(gl.getUniformLocation(progP,'uTouchOn'), touchOn);
  gl.uniform1f(gl.getUniformLocation(progP,'uDPR'), DPR);
  gl.drawArrays(gl.POINTS, 0, N);

  touchOn *= 0.94;
  raf = requestAnimationFrame(frame);
}

if(gl && !reduce){
  try{
    progP = link(VS, FS);
    progL = link(LVS, LFS);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.clearColor(0,0,0,0);

    var go = function(){
      document.body.classList.add('gpu');
      resize();
      cv.classList.add('on');
      t0 = performance.now();
      requestAnimationFrame(function(){
        document.querySelector('.stage').classList.remove('pre');
        document.body.classList.add('go');
      });
      frame();
    };
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(go).catch(go);
    else go();

    var rt;
    window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(resize, 160); }, {passive:true});
    window.addEventListener('scroll', function(){
      var rr = markEl.getBoundingClientRect();
      markC = [rr.left + rr.width/2, rr.top + rr.height/2];
    }, {passive:true});
    document.addEventListener('visibilitychange', function(){
      if(document.hidden){ if(raf){cancelAnimationFrame(raf); raf=null;} }
      else if(!raf){ raf = requestAnimationFrame(frame); }
    });
    window.addEventListener('pointermove', function(e){ touch=[e.clientX,e.clientY]; touchOn=1; }, {passive:true});
    window.addEventListener('touchmove', function(e){
      var pt = e.touches[0]; if(!pt) return; touch=[pt.clientX,pt.clientY]; touchOn=1;
    }, {passive:true});
  }catch(err){ /* no WebGL -> the CSS 3D mark stays */ }
}

/* ---------- parallax tilt ---------- */
var el = document.getElementById('tilt'), tx=0, ty=0, cx=0, cy=0, idle=0, active=false;
function loop(){
  idle += 0.012;
  var ix = active?0:Math.sin(idle)*1.6, iy = active?0:Math.cos(idle*0.8)*1.1;
  cx += ((tx+ix)-cx)*0.075; cy += ((ty+iy)-cy)*0.075;
  el.style.transform = 'rotateY('+cx.toFixed(2)+'deg) rotateX('+(-cy).toFixed(2)+'deg)';
  requestAnimationFrame(loop);
}
if(!reduce) requestAnimationFrame(loop);

window.addEventListener('pointermove', function(e){
  if(e.pointerType==='touch') return;
  active = true;
  tx = ((e.clientX/window.innerWidth)-.5)*11;
  ty = ((e.clientY/window.innerHeight)-.5)*8;
}, {passive:true});

function onOrient(e){
  if(e.gamma==null && e.beta==null) return;
  active = true;
  tx = Math.max(-12, Math.min(12, (e.gamma||0)*0.42));
  ty = Math.max(-9,  Math.min(9,  ((e.beta||0)-45)*0.20));
}
if(window.DeviceOrientationEvent && !reduce){
  if(typeof DeviceOrientationEvent.requestPermission === 'function'){
    var asked = false;
    document.addEventListener('touchend', function(){
      if(asked) return; asked = true;
      DeviceOrientationEvent.requestPermission().then(function(r){
        if(r==='granted') window.addEventListener('deviceorientation', onOrient, {passive:true});
      }).catch(function(){});
    }, {passive:true});
  } else {
    window.addEventListener('deviceorientation', onOrient, {passive:true});
  }
}
})();
</script>
</body>
