<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;

  :root{

  body{

  /* GPU particle field + morphing HR mark */
  #gl{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;
      opacity:0;transition:opacity .9s ease .15s}
  #gl.on{opacity:1}

  .st{position:fixed;pointer-events:none;z-index:0}
  .s1{top:-14vh;left:-24vw;width:60vw;height:70vh;transform:rotate(45deg);
      background:linear-gradient(180deg,rgba(1,62,106,0),rgba(3,70,140,.45),rgba(1,24,106,0))}
  .s2{top:-8vh;left:2vw;width:3px;height:58vh;transform:rotate(45deg);opacity:.45;
      background:linear-gradient(180deg,transparent,var(--glow),transparent)}
  .s3{bottom:-20vh;right:-28vw;width:66vw;height:74vh;transform:rotate(45deg);
      background:linear-gradient(180deg,rgba(1,62,106,0),rgba(3,70,140,.4),rgba(1,24,106,0))}
  .s4{bottom:-12vh;right:5vw;width:3px;height:56vh;transform:rotate(45deg);opacity:.4;
      background:linear-gradient(180deg,transparent,var(--glow),transparent)}

  .wrap{position:relative;z-index:2;width:100%;max-width:420px;
        display:flex;flex-direction:column;align-items:center;flex:1;
        transform-style:preserve-3d}
  /* the camera pull-back : everything rushes back into place on load */
  .stage{width:100%;display:flex;flex-direction:column;align-items:center;flex:1;
         transform-style:preserve-3d;
         animation:pullback 10.2s cubic-bezier(.10,.62,.10,1) both}
  .stage.pre{animation:none;opacity:0}
  @keyframes pullback{
    0%  {opacity:0; filter:blur(30px); transform:scale(4.2)  translateY(110px) rotate(7deg)}
    80% {opacity:0}
    92% {opacity:1; filter:blur(5px)}
    100%{opacity:1; filter:blur(0);    transform:scale(1) translateY(0) rotate(0)}
  }
  /* impact beat when the letters lock in */
  .flash{position:fixed;inset:0;z-index:3;pointer-events:none;background:#bfeaff;
         opacity:0;mix-blend-mode:screen}
  body.go .flash{animation:flash 1.2s ease-out 9.10s both}
  @keyframes flash{0%{opacity:0}16%{opacity:.17}100%{opacity:0}}
  .wave{position:fixed;left:50%;top:26%;z-index:3;pointer-events:none;
        width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
        border:2px solid rgba(127,211,245,.9);opacity:0}
  body.go .wave{animation:wave 1.8s cubic-bezier(.16,1,.3,1) 9.15s both}
  body.go .wave.b{animation-delay:9.35s;border-color:rgba(132,169,255,.6)}
  @keyframes wave{
    0%{opacity:.95; transform:scale(.2)}
    100%{opacity:0; transform:scale(34)}
  }

  .markbox{position:relative;transform-style:preserve-3d}
  .hr,.hrback{font-weight:700;font-size:clamp(54px,17vw,72px);line-height:1;
      letter-spacing:.04em;white-space:nowrap}
  .hr{position:relative;z-index:2;

      -webkit-background-clip:text;background-clip:text;color:transparent;
      transform:translateZ(46px);animation:float 5.5s ease-in-out infinite}
  .hrback{position:absolute;left:0;top:0;z-index:1;color:#0f4a86;
      transform:translateZ(30px);animation:floatb 5.5s ease-in-out infinite;
      text-shadow:1px 1px 0 #14508f,2px 2px 0 #124883,3px 3px 0 #0f3f74,
                  4px 4px 0 #0d3765,5px 5px 0 #0b2f56,6px 6px 0 #092747,

  @keyframes floatb{0%,100%{transform:translateZ(30px) translateY(0)}50%{transform:translateZ(30px) translateY(-6px)}}

  body.gpu .hr,body.gpu .hrback{visibility:hidden}

  .halo{position:absolute;left:50%;top:50%;width:230px;height:230px;z-index:0;

  .b .ar{width:15px;height:15px;flex:none;stroke:#5f7ba8;fill:none;stroke-width:2;

        min-height:50px;border-radius:15px;text-decoration:none;color:var(--ink);
        background:linear-gradient(145deg,rgba(132,169,255,.09),rgba(132,169,255,.03));
        border:1px solid var(--line);
        -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
        box-shadow:0 8px 20px -14px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06);

  .mini:active{transform:scale(.985)}
  @media(hover:hover){.mini:hover{border-color:rgba(67,209,255,.45)}}
  .mini svg{width:17px;height:17px;stroke:var(--cyan);fill:none;stroke-width:1.7;

  /* skip control */
  .skip{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;
        display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;
        font:400 11.5px/1 'Poppins',system-ui,sans-serif;letter-spacing:.16em;color:#9fc4e8;
        background:rgba(10,20,38,.55);border:1px solid rgba(132,169,255,.28);
        -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
        cursor:pointer;opacity:0;pointer-events:none;transition:opacity .45s ease}
  body.go .skip{opacity:1;pointer-events:auto;transition-delay:.7s}
  body.skipped .skip,body.arrived .skip{opacity:0;pointer-events:none;transition-delay:0s}
  .skip svg{width:12px;height:12px;stroke:#9fc4e8;fill:none;stroke-width:2;
            stroke-linecap:round;stroke-linejoin:round}
  body.skipped .stage{animation:none!important;opacity:1;filter:none;transform:none}
  body.skipped .flash,body.skipped .wave{animation:none!important;opacity:0}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>

<script>
(function(){
"use strict";
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ==========================================================================
   ONE UNBROKEN SHOT — nothing morphs, nothing pops.
   A spark of light resolves into Fahad's QR code; the code is sitting on his
   business card; the card is lying on the ground; the ground is a planet;
   the planet falls away to a star; the camera settles in the lobby.
   Everything exists from frame one. The camera simply keeps pulling back.
   Pure WebGL. No library, no images, no video.
   ========================================================================== */
var QRB = "1111111001100111111010111111110000010101011011101101000001101110100011000000011010111011011101011110001110010101110110111010111000110011001011101100000100110000010000010000011111111010101010101010111111100000000111000010000000000000010111101010011110101110110101010110100110000111100011000010110110011100010110001001100111111011100100001010110010000111111010110001000110110100100000001001110111100101011101010000100111000001011000100011010100100111111111010011110000101011111100011100100100001111111011011011011111000111001101011101011001010101000000111001001101101100011000011100111110111111010111011111111000000000011010011001110001000011111110001001011111101010110100000101100011001001000110001011101011001101111111111101110111010110000101101010000010101110100011110010110001101111000001010110101001001011110111111110000110001001111110000", QN = 29;
var cv = document.getElementById('gl'), gl = null;
try{
  gl = cv.getContext('webgl',{alpha:true,antialias:false,premultipliedAlpha:false,powerPreference:'high-performance'})
    || cv.getContext('experimental-webgl');
}catch(e){}

/* ---- world units = one QR module.  measured off the real printed card ---- */
var MOD   = 72.391/QN;                 // card-px per module, from the Canva file
var CARDW = 336 / MOD, CARDH = 192 / MOD;
var CARDC = [ (168 - 101.315)/MOD, (96 - 102.177)/MOD ];   // card centre, QR at origin
var RW    = 60000;                                          // planet radius, in modules

/* ------------------------------ particles ------------------------------ */
var PVS = [
'precision highp float;',
'attribute vec2 aQR; attribute vec3 aStar; attribute vec3 aSeed;',
'uniform vec2 uRes; uniform vec2 uAnchor; uniform float uTime;',
'uniform float uScale; uniform float uRoll; uniform float uQRA; uniform float uDPR;',
'uniform vec2 uTouch; uniform float uTouchOn;',
'varying float vA; varying float vSeed; varying float vNear;',
'void main(){',
'  float s1 = aSeed.x, s2 = aSeed.y, s3 = aSeed.z;',
'  float amb = step(0.58, s3);',
'  vec2 rel; float a;',
'  if(amb > 0.5){',
'    float k = 1.0 / (1.0 + (0.35 + s1*2.2)*0.55);',
'    rel  = (aStar.xy - uRes*0.5) * (0.55 + k*0.85);',
'    rel += vec2(sin(uTime*0.15 + s1*20.0), cos(uTime*0.12 + s2*17.0)) * 12.0;',
'    a = 0.26 + s2*0.52; vNear = k;',
'  } else {',
'    rel = aQR * uScale; a = uQRA; vNear = 1.0;',
'  }',
'  float cr = cos(uRoll), sr = sin(uRoll);',
'  rel = vec2(rel.x*cr - rel.y*sr, rel.x*sr + rel.y*cr);',
'  vec2 sp = (amb > 0.5 ? uRes*0.5 : uAnchor) + rel;',
'  vec2 dd = sp - uTouch;',
'  sp += normalize(dd + 0.0001) * uTouchOn * smoothstep(120.0, 0.0, length(dd)) * 40.0;',
'  gl_Position = vec4(sp.x/uRes.x*2.0 - 1.0, 1.0 - sp.y/uRes.y*2.0, 0.0, 1.0);',
'  float sz = amb > 0.5 ? (1.1 + s2*1.5) : clamp(uScale*0.50, 1.3, 14.0);',
'  gl_PointSize = max(1.0, sz * uDPR);',
'  vA = a; vSeed = s2;',
'}'].join('\n');

var PFS = [
'precision highp float;',
'varying float vA; varying float vSeed; varying float vNear;',
'void main(){',
'  vec2 uv = gl_PointCoord - 0.5;',
'  float r = length(uv);',
'  if(r > 0.5) discard;',
'  float a = smoothstep(0.5, 0.05, r) * vA;',
'  if(a < 0.004) discard;',
'  vec3 col = mix(vec3(0.26,0.52,0.94), vec3(0.76,0.94,1.00), vNear*0.65 + vSeed*0.35);',
'  col = mix(col, vec3(1.0), pow(a, 5.0)*0.6);',
'  gl_FragColor = vec4(col * a, a);',
'}'].join('\n');

/* -------------------------------- card --------------------------------- */
var CVS = [
'precision highp float;',
'attribute vec2 aPos; attribute vec2 aUV;',
'uniform vec2 uRes; uniform vec2 uAnchor; uniform float uScale; uniform float uRoll;',
'varying vec2 vUV;',
'void main(){',
'  vec2 rel = aPos * uScale;',
'  float cr = cos(uRoll), sr = sin(uRoll);',
'  rel = vec2(rel.x*cr - rel.y*sr, rel.x*sr + rel.y*cr);',
'  vec2 sp = uAnchor + rel;',
'  gl_Position = vec4(sp.x/uRes.x*2.0 - 1.0, 1.0 - sp.y/uRes.y*2.0, 0.0, 1.0);',
'  vUV = aUV;',
'}'].join('\n');

var CFS = [
'precision highp float;',
'uniform sampler2D uTex; uniform float uCA;',
'varying vec2 vUV;',
'void main(){',
'  vec4 t = texture2D(uTex, vUV);',
'  gl_FragColor = vec4(t.rgb * t.a * uCA, t.a * uCA);',
'}'].join('\n');

/* -------------------------------- planet ------------------------------- */
var GVS = ['precision highp float;','attribute vec2 aQuad;',
'void main(){ gl_Position = vec4(aQuad, 0.0, 1.0); }'].join('\n');

var GFS = [
'precision highp float;',
'uniform vec2 uResPx; uniform float uDPR; uniform vec2 uPC; uniform float uPR;',
'uniform float uTime; uniform float uPA;',
'float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7)))*43758.5453); }',
'float vn(vec3 p){',
'  vec3 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);',
'  float a = mix(mix(hash(i), hash(i+vec3(1.,0.,0.)), f.x), mix(hash(i+vec3(0.,1.,0.)), hash(i+vec3(1.,1.,0.)), f.x), f.y);',
'  float b = mix(mix(hash(i+vec3(0.,0.,1.)), hash(i+vec3(1.,0.,1.)), f.x), mix(hash(i+vec3(0.,1.,1.)), hash(i+vec3(1.,1.,1.)), f.x), f.y);',
'  return mix(a, b, f.z);',
'}',
'float fbm(vec3 p){ float a=0.5, s=0.0; for(int i=0;i<4;i++){ s+=a*vn(p); p*=2.03; a*=0.5; } return s; }',
'void main(){',
'  vec2 sc = vec2(gl_FragCoord.x, uResPx.y - gl_FragCoord.y) / uDPR;',
'  vec2 vP = (sc - uPC) / uPR;',
'  float r2 = dot(vP, vP);',
'  vec3 L = normalize(vec3(0.55, -0.34, 0.76));',
'  if(r2 > 1.0){',
'    float d = sqrt(r2);',
'    float a = exp(-(d - 1.0) * 7.0) * (0.15 + max(dot(normalize(vec3(vP, 0.02)), L), 0.0)*0.60) * uPA;',
'    if(a < 0.004) discard;',
'    gl_FragColor = vec4(vec3(0.30, 0.60, 1.0) * a, a);',
'    return;',
'  }',
'  vec3 n = vec3(vP, sqrt(max(0.0, 1.0 - r2)));',
'  float spn = uTime * 0.05, cs = cos(spn), sn = sin(spn);',
'  vec3 q = vec3(n.x*cs + n.z*sn, n.y, -n.x*sn + n.z*cs);',
'  float isLand = smoothstep(0.470, 0.545, fbm(q*2.1 + 9.4));',
'  vec3 base = mix(mix(vec3(0.010,0.055,0.170), vec3(0.020,0.120,0.290), fbm(q*4.5)),',
'                  mix(vec3(0.055,0.150,0.105), vec3(0.185,0.230,0.140), fbm(q*7.0)), isLand);',
'  float dif = max(dot(n, L), 0.0);',
'  float night = smoothstep(0.14, -0.08, dot(n, L));',
'  float city = smoothstep(0.600, 0.735, fbm(q*26.0)) * isLand * night;',
'  vec3 col = base * (0.05 + dif*1.22);',
'  col += vec3(1.0, 0.74, 0.40) * city * 1.9;',
'  float cl = smoothstep(0.545, 0.760, fbm(q*3.2 + vec3(uTime*0.012, 0.0, 0.0)));',
'  col = mix(col, vec3(0.90,0.94,1.0) * (0.10 + dif*0.95), cl*0.52);',
'  col += vec3(0.28, 0.58, 1.0) * pow(r2, 7.0) * (0.22 + dif*0.85);',
'  gl_FragColor = vec4(col * uPA, uPA);',
'}'].join('\n');

function sh(t2, src){
  var o = gl.createShader(t2); gl.shaderSource(o, src); gl.compileShader(o);
  if(!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o));
  return o;
}
function link(v, f){
  var p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, v));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, f));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

/* ------------- the card back, drawn to a texture (QR left out) ---------- */
function cardTexture(){
  var S = 4, c = document.createElement('canvas');
  c.width = 336*S; c.height = 192*S;
  var x = c.getContext('2d'), W2 = c.width, H2 = c.height;
  x.fillStyle = '#000103'; x.fillRect(0,0,W2,H2);
  // the diagonal light panel on the right, as on the printed card
  x.save();
  x.translate(W2*0.80, H2*0.30); x.rotate(-Math.PI/4);
  var g1 = x.createLinearGradient(-W2*0.30, 0, W2*0.30, 0);
  g1.addColorStop(0,   'rgba(1,24,106,0)');
  g1.addColorStop(0.35,'rgba(46,106,158,0.85)');
  g1.addColorStop(0.60,'rgba(143,184,214,0.95)');
  g1.addColorStop(1,   'rgba(1,24,106,0)');
  x.fillStyle = g1; x.fillRect(-W2*0.30, -H2*1.1, W2*0.60, H2*2.2);
  x.restore();
  x.save();
  x.translate(W2*0.62, H2*0.12); x.rotate(-Math.PI/4);
  var g2 = x.createLinearGradient(0,-H2, 0, H2);
  g2.addColorStop(0,'rgba(67,209,255,0)');
  g2.addColorStop(0.5,'rgba(67,209,255,0.75)');
  g2.addColorStop(1,'rgba(67,209,255,0)');
  x.fillStyle = g2; x.fillRect(-1.5*S, -H2, 3*S, H2*2);
  x.restore();
  // "SCAN TO SEE WHAT I BUILD"
  x.textBaseline = 'middle'; x.textAlign = 'left';
  x.fillStyle = '#84a9ff';
  var fs = 9.16*S;
  x.font = '700 ' + fs + 'px Poppins, system-ui, sans-serif';
  var msg = 'SCAN TO SEE WHAT I BUILD', tx = 19.2*S, ty = 39.3*S, ls = 1.44*S, i;
  for(i=0; i<msg.length; i++){ x.fillText(msg[i], tx, ty); tx += x.measureText(msg[i]).width + ls; }
  // hairline
  var g3 = x.createLinearGradient(58*S, 0, 145*S, 0);
  g3.addColorStop(0,'rgba(1,62,106,0)'); g3.addColorStop(0.3,'rgba(67,209,255,0.9)');
  g3.addColorStop(0.7,'rgba(65,154,214,0.7)'); g3.addColorStop(1,'rgba(1,24,106,0)');
  x.fillStyle = g3; x.fillRect(58*S, 53*S, 87*S, 1.1*S);
  // the line under the code
  x.textAlign = 'center';
  var f2 = 8*S;
  x.font = '700 ' + f2 + 'px Poppins, system-ui, sans-serif';
  function spaced(txt, cx, cy, sp){
    var w = 0, j;
    for(j=0;j<txt.length;j++) w += x.measureText(txt[j]).width + sp;
    var px = cx - (w - sp)/2;
    x.textAlign = 'left';
    for(j=0;j<txt.length;j++){ x.fillText(txt[j], px, cy); px += x.measureText(txt[j]).width + sp; }
    x.textAlign = 'center';
  }
  x.fillStyle = '#84a9ff';
  spaced('People build companies', 104*S, 155*S, 2.26*S);
  spaced('We build people',        101*S, 168*S, 3.06*S);

  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  return tex;
}

/* -------------------------------- state -------------------------------- */
var pProg, cProg, gProg, PU={}, CU={}, GU={}, buf={}, quadBuf, cardBuf, cardTex, N=0;
var W=0, H=0, DPR=1, anchor=[0,0], markC=[0,0], t0=performance.now(), raf=null;
var touch=[-9999,-9999], touchOn=0;
var markEl = document.querySelector('.hr');

var INTRO = 10.2;
var scale = 0.85, roll = 0.30, qrA = 0, cA = 0, pA = 0, pR = 1e9, settle = 0;
var skipped = false;

function seg(t,a,b){ return Math.max(0, Math.min(1, (t-a)/(b-a))); }
function smooth(x){ return x*x*(3-2*x); }
function outQuint(x){ return 1 - Math.pow(1-x, 5); }

var S_IN = 0.85, S_CODE = 13.0, S_END = 0.00090;

function build(){
  var r = markEl.getBoundingClientRect();
  markC = [r.left + r.width/2, r.top + r.height/2];

  var lit = [];
  for(var y=0; y<QN; y++) for(var x=0; x<QN; x++)
    if(QRB.charCodeAt(y*QN+x) === 49) lit.push(x, y);
  var nLit = lit.length/2;

  var MAX = (W*H > 900*900) ? 22000 : 14000;
  var qr = [], star = [], seed = [];
  for(var i=0; i<MAX; i++){
    var li = (i % nLit)*2;
    qr.push(lit[li]   - QN/2 + 0.10 + Math.random()*0.80,
            lit[li+1] - QN/2 + 0.10 + Math.random()*0.80);
    star.push((Math.random()*2.2-0.6)*W, (Math.random()*2.2-0.6)*H, 0);
    seed.push(Math.random(), Math.random(), Math.random());
  }
  N = MAX;

  gl.useProgram(pProg);
  function up(name, arr, n){
    var L = gl.getAttribLocation(pProg, name); if(L<0) return;
    if(!buf[name]) buf[name] = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf[name]);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(arr), gl.STATIC_DRAW);
  }
  up('aQR', qr, 2); up('aStar', star, 3); up('aSeed', seed, 3);

  // card quad, in module units, positioned so the QR lands exactly in its slot
  var L2 = CARDC[0] - CARDW/2, R2 = CARDC[0] + CARDW/2;
  var T2 = CARDC[1] - CARDH/2, B2 = CARDC[1] + CARDH/2;
  var cd = new Float32Array([
    L2,T2, 0,0,   R2,T2, 1,0,   L2,B2, 0,1,   R2,B2, 1,1
  ]);
  if(!cardBuf) cardBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, cardBuf);
  gl.bufferData(gl.ARRAY_BUFFER, cd, gl.STATIC_DRAW);
}

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  gl.viewport(0,0,cv.width,cv.height);
  build();
}

function timeline(t){
  if(t < INTRO){
    if(t < 1.45){
      scale = S_IN * Math.pow(S_CODE/S_IN, outQuint(seg(t, 0.0, 1.45)));
    } else if(t < 2.05){
      scale = S_CODE;
    } else {
      var e = seg(t, 2.05, 9.30);
      scale = S_CODE * Math.pow(S_END/S_CODE, e*e*(3-2*e));
    }
    roll   = 0.30 * Math.max(0, 1 - seg(t, 0.3, 4.6));
    settle = smooth(seg(t, 8.60, 9.95));
  } else {
    scale += (S_END - scale)*0.08; roll *= 0.93; settle += (1-settle)*0.1;
  }
  qrA = smooth(seg(scale, 0.055, 0.42));
  cA  = smooth(seg(scale, 0.0012, 0.02)) * smooth(1 - seg(scale, 4.2, 9.5));
  pR  = RW * scale;
  pA  = smooth(1 - seg(pR, 3600, 13000));
  // as the code shrinks, the camera drifts to frame the whole card
  var fr = smooth(1 - seg(scale, 1.1, 5.5));
  var ox = -CARDC[0]*scale*fr, oy = -CARDC[1]*scale*fr;
  anchor = [ W*0.5 + ox + (markC[0]-W*0.5)*settle,
             H*0.5 + oy + (markC[1]-H*0.5)*settle ];
}

function frame(){
  var t = (performance.now()-t0)/1000;
  timeline(t);
  gl.clear(gl.COLOR_BUFFER_BIT);

  if(pA > 0.004){
    gl.useProgram(gProg);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    var LQ = gl.getAttribLocation(gProg, 'aQuad');
    gl.enableVertexAttribArray(LQ);
    gl.vertexAttribPointer(LQ, 2, gl.FLOAT, false, 0, 0);
    gl.uniform2f(GU.uResPx, cv.width, cv.height);
    gl.uniform1f(GU.uDPR, DPR);
    gl.uniform2f(GU.uPC, anchor[0], anchor[1] + pR);
    gl.uniform1f(GU.uPR, pR);
    gl.uniform1f(GU.uTime, t);
    gl.uniform1f(GU.uPA, pA);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.disableVertexAttribArray(LQ);
  }

  if(cA > 0.004 && cardTex){
    gl.useProgram(cProg);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindBuffer(gl.ARRAY_BUFFER, cardBuf);
    var LP = gl.getAttribLocation(cProg, 'aPos'), LU = gl.getAttribLocation(cProg, 'aUV');
    gl.enableVertexAttribArray(LP); gl.vertexAttribPointer(LP, 2, gl.FLOAT, false, 16, 0);
    gl.enableVertexAttribArray(LU); gl.vertexAttribPointer(LU, 2, gl.FLOAT, false, 16, 8);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, cardTex);
    gl.uniform1i(CU.uTex, 0);
    gl.uniform2f(CU.uRes, W, H);
    gl.uniform2f(CU.uAnchor, anchor[0], anchor[1]);
    gl.uniform1f(CU.uScale, scale);
    gl.uniform1f(CU.uRoll, roll);
    gl.uniform1f(CU.uCA, cA);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.disableVertexAttribArray(LP); gl.disableVertexAttribArray(LU);
  }

  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.useProgram(pProg);
  var PL = [['aQR',2],['aStar',3],['aSeed',3]];
  for(var i=0;i<PL.length;i++){
    var a = gl.getAttribLocation(pProg, PL[i][0]); if(a<0) continue;
    gl.bindBuffer(gl.ARRAY_BUFFER, buf[PL[i][0]]);
    gl.enableVertexAttribArray(a);
    gl.vertexAttribPointer(a, PL[i][1], gl.FLOAT, false, 0, 0);
  }
  gl.uniform2f(PU.uRes, W, H);
  gl.uniform2f(PU.uAnchor, anchor[0], anchor[1]);
  gl.uniform1f(PU.uTime, t);
  gl.uniform1f(PU.uScale, scale);
  gl.uniform1f(PU.uRoll, roll);
  gl.uniform1f(PU.uQRA, qrA);
  gl.uniform1f(PU.uDPR, DPR);
  gl.uniform2f(PU.uTouch, touch[0], touch[1]);
  gl.uniform1f(PU.uTouchOn, touchOn);
  gl.drawArrays(gl.POINTS, 0, N);

  touchOn *= 0.94;
  raf = requestAnimationFrame(frame);
}

function doSkip(){
  if(skipped) return;
  skipped = true;
  t0 = performance.now() - INTRO*1000;
  document.body.classList.add('skipped');
  document.body.classList.add('arrived');
  var st = document.querySelector('.stage'); if(st) st.classList.remove('pre');
  scale = S_END; roll = 0; settle = 1; qrA = 0; cA = 0;
}
var skipBtn = document.getElementById('skip');
if(skipBtn) skipBtn.addEventListener('click', doSkip);

if(gl && !reduce){
  try{
    pProg = link(PVS, PFS);
    cProg = link(CVS, CFS);
    gProg = link(GVS, GFS);
    ['uRes','uAnchor','uTime','uScale','uRoll','uQRA','uDPR','uTouch','uTouchOn']
      .forEach(function(k){ PU[k] = gl.getUniformLocation(pProg,k); });
    ['uRes','uAnchor','uScale','uRoll','uTex','uCA']
      .forEach(function(k){ CU[k] = gl.getUniformLocation(cProg,k); });
    ['uResPx','uDPR','uPC','uPR','uTime','uPA']
      .forEach(function(k){ GU[k] = gl.getUniformLocation(gProg,k); });
    quadBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.clearColor(0,0,0,0);

    var go = function(){
      document.body.classList.add('gpu');
      resize();
      cardTex = cardTexture();
      cv.classList.add('on');
      t0 = performance.now();
      requestAnimationFrame(function(){
        var st = document.querySelector('.stage'); if(st) st.classList.remove('pre');
        document.body.classList.add('go');
      });
      setTimeout(function(){ document.body.classList.add('arrived'); }, INTRO*1000 + 300);
      frame();
    };
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(go).catch(go);
    else go();

    var rt;
    window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(resize,160); }, {passive:true});
    window.addEventListener('scroll', function(){
      var rr = markEl.getBoundingClientRect();
      markC = [rr.left + rr.width/2, rr.top + rr.height/2];
    }, {passive:true});
    document.addEventListener('visibilitychange', function(){
      if(document.hidden){ if(raf){cancelAnimationFrame(raf); raf=null;} }
      else if(!raf){ raf = requestAnimationFrame(frame); }
    });
    window.addEventListener('pointermove', function(e){ touch=[e.clientX,e.clientY]; touchOn=1; }, {passive:true});
    window.addEventListener('touchmove', function(e){
      var pt=e.touches[0]; if(!pt) return; touch=[pt.clientX,pt.clientY]; touchOn=1;
    }, {passive:true});
  }catch(err){ if(skipBtn) skipBtn.style.display='none'; doSkip(); }
} else { if(skipBtn) skipBtn.style.display='none'; doSkip(); }

/* --------------------------- parallax tilt ----------------------------- */
var el = document.getElementById('tilt'), tx=0, ty=0, cx=0, cy=0, idle=0, active=false;
function loop(){
  idle += 0.012;
  var ix = active?0:Math.sin(idle)*1.6, iy = active?0:Math.cos(idle*0.8)*1.1;
  cx += ((tx+ix)-cx)*0.075; cy += ((ty+iy)-cy)*0.075;
  el.style.transform = 'rotateY('+cx.toFixed(2)+'deg) rotateX('+(-cy).toFixed(2)+'deg)';
  requestAnimationFrame(loop);
}
if(!reduce) requestAnimationFrame(loop);
window.addEventListener('pointermove', function(e){
  if(e.pointerType==='touch') return;
  active = true;
  tx = ((e.clientX/window.innerWidth)-.5)*11;
  ty = ((e.clientY/window.innerHeight)-.5)*8;
}, {passive:true});
function onOrient(e){
  if(e.gamma==null && e.beta==null) return;
  active = true;
  tx = Math.max(-12, Math.min(12, (e.gamma||0)*0.42));
  ty = Math.max(-9,  Math.min(9,  ((e.beta||0)-45)*0.20));
}
if(window.DeviceOrientationEvent && !reduce){
  if(typeof DeviceOrientationEvent.requestPermission === 'function'){
    var asked = false;
    document.addEventListener('touchend', function(){
      if(asked) return; asked = true;
      DeviceOrientationEvent.requestPermission().then(function(r){
        if(r==='granted') window.addEventListener('deviceorientation', onOrient, {passive:true});
      }).catch(function(){});
    }, {passive:true});
  } else { window.addEventListener('deviceorientation', onOrient, {passive:true}); }
}
})();
</script>
</body>
