  *{margin:0;padding:0;box-sizing:border-box}
  html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;

  :root{

  body{

    padding:calc(58px + env(safe-area-inset-top,0px)) 24px calc(30px + env(safe-area-inset-bottom,0px));
    perspective:1100px;
  }

  /* GPU particle field + morphing HR mark */
  #gl{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;
      opacity:0;transition:opacity .9s ease .15s}
  #gl.on{opacity:1}

  .st{position:fixed;pointer-events:none;z-index:0}
  .s1{top:-14vh;left:-24vw;width:60vw;height:70vh;transform:rotate(45deg);

  .s2{top:-8vh;left:2vw;width:3px;height:58vh;transform:rotate(45deg);opacity:.45;
      background:linear-gradient(180deg,transparent,var(--glow),transparent)}
  .s3{bottom:-20vh;right:-28vw;width:66vw;height:74vh;transform:rotate(45deg);
      background:linear-gradient(180deg,rgba(1,62,106,0),rgba(3,70,140,.4),rgba(1,24,106,0))}
  .s4{bottom:-12vh;right:5vw;width:3px;height:56vh;transform:rotate(45deg);opacity:.4;

  .wrap{position:relative;z-index:2;width:100%;max-width:420px;
        display:flex;flex-direction:column;align-items:center;flex:1;
        transform-style:preserve-3d}
  /* the camera pull-back : everything rushes back into place on load */
  .stage{width:100%;display:flex;flex-direction:column;align-items:center;flex:1;
         transform-style:preserve-3d;
         animation:pullback 1.9s cubic-bezier(.16,1,.3,1) both}
  .stage.pre{animation:none;opacity:0}
  @keyframes pullback{
    0%  {opacity:0; filter:blur(18px); transform:scale(2.15) translateY(46px)}
    55% {opacity:1}
    100%{opacity:1; filter:blur(0);    transform:scale(1) translateY(0)}
  }
  /* impact beat when the letters lock in */
  .flash{position:fixed;inset:0;z-index:3;pointer-events:none;background:#bfeaff;
         opacity:0;mix-blend-mode:screen}
  body.go .flash{animation:flash 1.0s ease-out 1.35s both}
  @keyframes flash{0%{opacity:0}16%{opacity:.17}100%{opacity:0}}
  .wave{position:fixed;left:50%;top:26%;z-index:3;pointer-events:none;

  body.go .wave.b{animation-delay:1.56s;border-color:rgba(132,169,255,.6)}
  @keyframes wave{
    0%{opacity:.95; transform:scale(.2)}

  }

  .markbox{position:relative;transform-style:preserve-3d}
  .hr,.hrback{font-weight:700;font-size:clamp(54px,17vw,72px);line-height:1;

  .hrback{position:absolute;left:0;top:0;z-index:1;color:#0f4a86;

      text-shadow:1px 1px 0 #14508f,2px 2px 0 #124883,3px 3px 0 #0f3f74,

  .b .t{flex:1;font-size:clamp(13.5px,3.9vw,14.5px);letter-spacing:.05em;font-weight:400}

  .foot{width:100%;margin-top:auto;padding-top:30px;display:flex;gap:12px;

  .mini{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;

        background:linear-gradient(145deg,rgba(132,169,255,.09),rgba(132,169,255,.03));
        border:1px solid var(--line);
        -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
        box-shadow:0 8px 20px -14px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06);

  .mini:active{transform:scale(.985)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>

<script>
(function(){
"use strict";
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ============================================================
   GPU particle mark — particles fly in from a cloud and
   assemble the letters "HR", breathe, scatter, reassemble.
   Pure WebGL, no library.
   ============================================================ */
var cv = document.getElementById('gl');
var gl = null;
try{
  gl = cv.getContext('webgl',{alpha:true,antialias:false,premultipliedAlpha:false,powerPreference:'high-performance'})
    || cv.getContext('experimental-webgl');
}catch(e){}

var VS = [
'precision highp float;',
'attribute vec2 aTarget;',   // pixel-space target inside the mark box
'attribute vec3 aCloud;',    // scattered home position (pixels, + depth)
'attribute vec3 aSeed;',     // random seeds
'uniform vec2  uRes;',
'uniform vec2  uMark;',      // mark box centre in pixels
'uniform float uTime;',
'uniform float uMorph;',     // 0 = cloud, 1 = letters
'uniform vec2  uTouch;',     // pointer in pixels
'uniform float uTouchOn;',
'uniform float uDPR;',
'uniform float uZoom;',
'uniform float uChaos;',
'varying float vDepth;',
'varying float vSeed;',
'void main(){',
'  float s1 = aSeed.x, s2 = aSeed.y, s3 = aSeed.z;',
// per-particle stagger so the assembly ripples instead of snapping
'  float m = clamp((uMorph - s1*0.35) / 0.65, 0.0, 1.0);',
'  m = m*m*(3.0-2.0*m);',
'  float amb = step(0.74, s3);',   // ~26% never join the letters — ambient depth field
'  m *= (1.0 - amb);',
'  vec3 cloud = aCloud;',
// slow drift while scattered
'  float spin = uTime*0.42 * (1.0 - amb);',
'  float cs = cos(spin), sn = sin(spin);',
'  vec2 rot = vec2(aCloud.x*cs - aCloud.z*sn, aCloud.x*sn + aCloud.z*cs);',
'  cloud.x = mix(cloud.x, rot.x + uMark.x, 1.0 - amb);',
'  cloud.y += (1.0 - amb) * uMark.y;',
'  cloud.z = mix(cloud.z, rot.y, 1.0 - amb);',
'  cloud.x += sin(uTime*0.55 + s1*32.0)*14.0;',
'  cloud.y += cos(uTime*0.47 + s2*27.0)*12.0;',
'  cloud.z += sin(uTime*0.33 + s1*19.0)*28.0;',
'  vec3 letter = vec3(uMark + aTarget, 0.0);',
// letters breathe gently in depth so the glyph feels volumetric
'  letter.z += sin(uTime*1.15 + aTarget.x*0.035 + aTarget.y*0.02)*13.0;',
'  letter.y += sin(uTime*0.9)*3.0;',
'  vec3 p = mix(cloud, letter, m);',
// opening burst : everything is thrown across the screen, then rushes home
'  vec2 cdir = vec2(cos(s1*63.0 + s3*11.0), sin(s2*57.0 + s1*7.0));',
'  p.xy += cdir * uChaos * (260.0 + s3*620.0);',
'  p.z  += uChaos * (s1*1100.0 - 340.0);',
// pointer / touch repulsion
'  vec2 d = p.xy - uTouch;',
'  float dist = length(d);',
'  float f = uTouchOn * smoothstep(120.0, 0.0, dist) * 46.0;',
'  p.xy += normalize(d + 0.0001) * f;',
'  p.z  -= f*0.6;',
// perspective
'  float persp = 520.0 / (520.0 + p.z);',
'  vec2 org = mix(uRes*0.5, uMark, 1.0 - amb);',
'  vec2 sp = (p.xy - org) * persp + org;',
'  sp = (sp - uRes*0.5) * uZoom + uRes*0.5;',
'  vec2 clip = vec2(sp.x/uRes.x*2.0 - 1.0, 1.0 - sp.y/uRes.y*2.0);',
'  gl_Position = vec4(clip, 0.0, 1.0);',
'  float size = mix(1.9, 2.9, s2) * persp * uDPR * mix(1.0, 0.66, amb);',
'  gl_PointSize = max(1.0, size * (1.0 + m*0.35) * (1.0 + uChaos*0.9));',
'  vDepth = persp;',
'  vSeed  = s2;',
'}'].join('\n');

var FS = [
'precision highp float;',
'varying float vDepth;',
'varying float vSeed;',
'uniform float uMorph;',
'void main(){',
'  vec2 uv = gl_PointCoord - 0.5;',
'  float r = length(uv);',
'  if(r > 0.5) discard;',
'  float a = smoothstep(0.5, 0.06, r);',
'  vec3 deep = vec3(0.16, 0.38, 0.78);',
'  vec3 lit  = vec3(0.50, 0.86, 1.00);',
'  vec3 col  = mix(deep, lit, clamp((vDepth-0.62)/0.55, 0.0, 1.0));',
'  col = mix(col, vec3(1.0), pow(a, 6.0) * (0.35 + uMorph*0.45));',
'  float glow = (0.30 + vDepth*0.55) * (0.88 + uMorph*0.32) * (0.75 + vSeed*0.35);',
'  gl_FragColor = vec4(col * a * glow, a * glow);',
'}'].join('\n');

function sh(type, src){
  var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

/* sample the word "HR" into points, sized to the DOM mark box */
function sampleText(w, h){
  var c = document.createElement('canvas');
  var S = 2;                                   // supersample for cleaner edges
  c.width = Math.max(8, Math.round(w*S)); c.height = Math.max(8, Math.round(h*S));
  var x = c.getContext('2d');
  x.fillStyle = '#fff';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  var fs = Math.round(h*S*0.86);
  x.font = '700 ' + fs + 'px Poppins, system-ui, sans-serif';
  x.fillText('HR', c.width/2, c.height/2 + fs*0.03);
  var d = x.getImageData(0,0,c.width,c.height).data;
  var pts = [], step = 2;
  for(var yy=0; yy<c.height; yy+=step){
    for(var xx=0; xx<c.width; xx+=step){
      if(d[(yy*c.width+xx)*4+3] > 130){
        pts.push((xx/S - w/2) + (Math.random()-0.5)*1.1,
                 (yy/S - h/2) + (Math.random()-0.5)*1.1);
      }
    }
  }
  return pts;
}

var prog, loc = {}, buf = {}, N = 0;
var W=0,H=0,DPR=1, markC=[0,0], t0=performance.now(), raf=null;
var morph=0, phase=0, touch=[-9999,-9999], touchOn=0;
var INTRO=2.6, zoom=2.6, chaos=1.0;
function easeOutExpo(x){ return x>=1 ? 1 : 1 - Math.pow(2, -10*x); }
var markEl = document.querySelector('.hr');

function build(){
  var r = markEl.getBoundingClientRect();
  var mw = Math.max(80, r.width*1.22), mh = Math.max(50, r.height*1.15);
  markC = [r.left + r.width/2, r.top + r.height/2];

  var tp = sampleText(mw, mh);
  // cap the count so mid-range phones stay at 60fps
  var max = (W*H > 900*900) ? 26000 : 17000;
  var total = tp.length/2, stride = Math.max(1, Math.ceil(total/max));
  var target=[], cloud=[], seed=[];
  for(var i=0;i<total;i+=stride){
    target.push(tp[i*2], tp[i*2+1]);
    var s3 = Math.random();
    if(s3 >= 0.74){
      // ambient dust — absolute screen coords, spread over the whole page
      cloud.push(Math.random()*W, Math.random()*H, Math.random()*900 - 120);
    } else {
      // orb — stored relative to the mark so the glyph dissolves into a sphere
      var u = Math.random()*2-1, th = Math.random()*Math.PI*2,
          rr = Math.pow(Math.random(),0.30), sr = Math.sqrt(1-u*u), R = 68;
      cloud.push(Math.cos(th)*sr*rr*R*1.45,
                 Math.sin(th)*sr*rr*R,
                 u*rr*R*1.35);
    }
    seed.push(Math.random(), Math.random(), s3);
  }
  N = target.length/2;

  function up(name, arr, n){
    if(!buf[name]) buf[name] = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf[name]);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(arr), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(loc[name]);
    gl.vertexAttribPointer(loc[name], n, gl.FLOAT, false, 0, 0);
  }
  up('aTarget', target, 2);
  up('aCloud',  cloud,  3);
  up('aSeed',   seed,   3);
}

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  gl.viewport(0,0,cv.width,cv.height);
  build();
}

function frame(){
  var t = (performance.now()-t0)/1000;
  // assemble, hold, scatter, repeat
  var tgt;
  if(t < INTRO){
    // opening: chaos → camera pulls back → letters lock in
    var k = Math.min(1, t/1.75);
    zoom  = 2.6 - 1.6*easeOutExpo(k);
    chaos = 1.0 - easeOutExpo(Math.min(1, Math.max(0, (t-0.10)/1.35)));
    tgt   = t < 0.35 ? 0.0 : 1.0;
    morph += (tgt - morph) * 0.055;
  } else {
    zoom += (1.0 - zoom)*0.08; chaos *= 0.9;
    phase = (t - INTRO) % 18.0;
    tgt = (phase < 13.6) ? 1.0 : 0.0;
    morph += (tgt - morph) * (tgt > morph ? 0.022 : 0.030);
  }

  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(loc.uRes, W, H);
  gl.uniform2f(loc.uMark, markC[0], markC[1]);
  gl.uniform1f(loc.uTime, t);
  gl.uniform1f(loc.uMorph, morph);
  gl.uniform2f(loc.uTouch, touch[0], touch[1]);
  gl.uniform1f(loc.uTouchOn, touchOn);
  gl.uniform1f(loc.uDPR, DPR);
  gl.uniform1f(loc.uZoom, zoom);
  gl.uniform1f(loc.uChaos, chaos);
  gl.drawArrays(gl.POINTS, 0, N);
  touchOn *= 0.94;
  raf = requestAnimationFrame(frame);
}

if(gl && !reduce){
  try{
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    ['aTarget','aCloud','aSeed'].forEach(function(k){ loc[k] = gl.getAttribLocation(prog,k); });
    ['uRes','uMark','uTime','uMorph','uTouch','uTouchOn','uDPR','uZoom','uChaos'].forEach(function(k){
      loc[k] = gl.getUniformLocation(prog,k);
    });
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);       // additive → real glow
    gl.clearColor(0,0,0,0);

    // wait for the webfont so the sampled glyphs match the rest of the page
    var go = function(){
      document.body.classList.add('gpu');
      resize();                                   // measure while .stage is untransformed
      cv.classList.add('on');
      t0 = performance.now();
      requestAnimationFrame(function(){
        document.querySelector('.stage').classList.remove('pre');
        document.body.classList.add('go');
      });
      frame();
    };
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(go).catch(go);
    else go();

    var rt;
    window.addEventListener('resize', function(){
      clearTimeout(rt); rt = setTimeout(resize, 160);
    }, {passive:true});
    window.addEventListener('scroll', function(){
      var rr = markEl.getBoundingClientRect();
      markC = [rr.left + rr.width/2, rr.top + rr.height/2];
    }, {passive:true});
    document.addEventListener('visibilitychange', function(){
      if(document.hidden){ if(raf){cancelAnimationFrame(raf); raf=null;} }
      else if(!raf){ raf = requestAnimationFrame(frame); }
    });
    window.addEventListener('pointermove', function(e){
      touch = [e.clientX, e.clientY]; touchOn = 1;
    }, {passive:true});
    window.addEventListener('touchmove', function(e){
      var p = e.touches[0]; if(!p) return;
      touch = [p.clientX, p.clientY]; touchOn = 1;
    }, {passive:true});
  }catch(err){ /* no WebGL → the CSS 3D mark stays visible */ }
}

/* ---------- parallax tilt : gyroscope on phone, pointer on desktop ---------- */
var el = document.getElementById('tilt'), tx=0, ty=0, cx=0, cy=0, idle=0, active=false;
function loop(){
  idle += 0.012;
  var ix = active?0:Math.sin(idle)*1.6, iy = active?0:Math.cos(idle*0.8)*1.1;
  cx += ((tx+ix)-cx)*0.075;
  cy += ((ty+iy)-cy)*0.075;
  el.style.transform = 'rotateY('+cx.toFixed(2)+'deg) rotateX('+(-cy).toFixed(2)+'deg)';
  requestAnimationFrame(loop);
}
if(!reduce) requestAnimationFrame(loop);

window.addEventListener('pointermove', function(e){
  if(e.pointerType==='touch') return;
  active = true;
  tx = ((e.clientX/window.innerWidth)-.5)*11;
  ty = ((e.clientY/window.innerHeight)-.5)*8;
}, {passive:true});

function onOrient(e){
  if(e.gamma==null && e.beta==null) return;
  active = true;
  tx = Math.max(-12, Math.min(12, (e.gamma||0)*0.42));
  ty = Math.max(-9,  Math.min(9,  ((e.beta||0)-45)*0.20));
}
if(window.DeviceOrientationEvent && !reduce){
  if(typeof DeviceOrientationEvent.requestPermission === 'function'){
    var asked = false;
    document.addEventListener('touchend', function(){
      if(asked) return; asked = true;
      DeviceOrientationEvent.requestPermission().then(function(r){
        if(r==='granted') window.addEventListener('deviceorientation', onOrient, {passive:true});
      }).catch(function(){});
    }, {passive:true});
  } else {
    window.addEventListener('deviceorientation', onOrient, {passive:true});
  }
}
})();
</script>
